# Production Health Check Workflow
# Copy this file to the PRIVATE production repository at .github/workflows/health-check.yml
#
# Modeled on the PROVEN dev-repo staging-health-monitor.yml. The previous
# version of this file was an unedited placeholder: it curled
# https://api.production.example.com/health (a domain that does not exist, so
# every run reported the backend down) and reached the DB/Redis by SSHing from
# a `ubuntu-latest` runner — which cannot route to the campus VMs at all, the
# same constraint that forced the deploy workflows onto self-hosted runners.
#
# 2026-09-12 incident: this job filed a false 🚨 "production down" issue
# (Backend/Database healthy, Frontend HTTP 400, Redis NOAUTH) even though
# nothing was actually down. Root cause: this job deliberately has NO
# `environment:` key (see Prerequisites below), so it can only read
# Repository-level secrets/variables — and DOMAIN/REDIS_PASSWORD were never
# set there. In this deployment (NYCUITSC/naass) they were never even meant
# to be GitHub secrets: `deploy-stack.yml` runs in "operator-managed ENV_FILE"
# mode (the `production` Environment's `ENV_FILE` variable), which reads them
# straight from a `.env` file on the VM instead. `${{ secrets.DOMAIN }}` and
# `${{ secrets.REDIS_PASSWORD }}` therefore resolved to an EMPTY STRING with
# no warning: an empty Host header made nginx itself return 400 (RFC 7230
# requires a non-empty Host), and an empty password made redis-cli skip AUTH
# entirely, so PING came back "NOAUTH Authentication required" — both
# indistinguishable from a real outage.
#
# Fix: stop asking GitHub for these values at all. Both checks below now read
# state the production containers have ALREADY computed for themselves —
# exactly the pattern the Backend/Database checks already used (read
# backend's own /health verdict instead of independently connecting to
# Postgres) — so this workflow needs zero secrets, and the whole class of
# "secret only exists in the wrong place" bug is structurally gone, not just
# guarded against:
#   - Frontend: nginx.prod.conf's one HTTPS server block lists `localhost` as
#     a `server_name` right alongside the real production domain, so curl's
#     default Host header (the URL's own "localhost") already matches the
#     exact same block /health lives in — no need to know DOMAIN at all.
#   - Redis: docker-compose.prod.yml already defines a Docker healthcheck for
#     this container (`redis-cli -a $REDIS_PASSWORD ping`, run by the Docker
#     daemon using the password baked into the CONTAINER's own environment at
#     deploy time). Reading that verdict via `docker inspect` needs no
#     password here at all.
#
# Prerequisites:
#   - The self-hosted runner registered on the production AP VM, labels
#     [self-hosted, linux, production] (the same runner deploy-production.yml
#     uses). The `production` label is mandatory — the test AP VM also
#     answers to [self-hosted, linux], and probes that landed there would
#     report on the wrong stack. Scheduled, so deliberately NOT behind the
#     `production` environment's approval gate: it only reads.
#   - No secrets required — see the 2026-09-12 incident note above for why
#     that's a deliberate design choice, not an oversight.

name: Production Health Check

on:
  schedule:
    - cron: '0 */12 * * *' # Every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    name: Check Application Health
    # The runner lives ON the production AP VM, so every probe below is a
    # direct localhost/container check — the most direct signal of service
    # availability, with no VPN or SSH hop to fail independently.
    runs-on: [self-hosted, linux, production]
    permissions:
      issues: write
      contents: read

    steps:
      # Backend publishes no host port in production (expose-only), so probe
      # it from inside its own container.
      - name: Check backend API
        id: api-check
        continue-on-error: true
        run: |
          STATUS=$(docker exec scholarship_backend_prod \
            curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            http://localhost:8000/health 2>/dev/null || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [ "$STATUS" = "200" ] || { echo "::error::Backend API health check failed (HTTP $STATUS)"; exit 1; }
          echo "✅ Backend API is healthy (HTTP $STATUS)"

      - name: Check frontend through nginx
        id: frontend-check
        continue-on-error: true
        run: |
          # No Host-header override, no DOMAIN needed: nginx.prod.conf's one
          # HTTPS server block lists `localhost` as a server_name right
          # alongside the real production domain (and the "_" catch-all), so
          # curl's default Host (the URL's own "localhost") already routes
          # into the exact same block /health lives in. See the 2026-09-12
          # incident note at the top of this file.
          # -k: the cert is issued for the real domain, not "localhost".
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "https://localhost/" || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [ "$STATUS" = "200" ] || { echo "::error::Frontend health check failed (HTTP $STATUS)"; exit 1; }
          echo "✅ Frontend is healthy (HTTP $STATUS)"

      # PostgreSQL lives on the DB VM, not next to the app — there is no
      # `postgres` container here to exec into. /health already opens a real
      # pooled connection and reports the result, so read that verdict.
      - name: Check database connectivity
        id: db-check
        continue-on-error: true
        run: |
          BODY=$(docker exec scholarship_backend_prod \
            curl -s --max-time 10 http://localhost:8000/health 2>/dev/null || echo "{}")
          echo "$BODY"
          echo "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("database",{}).get("status")=="healthy" else 1)' \
            || { echo "::error::Database health check failed"; exit 1; }
          echo "✅ Database is healthy"

      - name: Check Redis cache
        id: redis-check
        continue-on-error: true
        run: |
          # Read Docker's own healthcheck verdict for this container instead
          # of authenticating ourselves — docker-compose.prod.yml already
          # runs `redis-cli -a $REDIS_PASSWORD ping` on a schedule using the
          # password baked into the CONTAINER's own environment at deploy
          # time, exactly the same "read the verdict, don't reconnect
          # yourself" pattern the database check above uses. See the
          # 2026-09-12 incident note at the top of this file.
          STATUS=$(docker inspect --format '{{.State.Health.Status}}' scholarship_redis_prod 2>/dev/null || echo "unknown")
          [ "$STATUS" = "healthy" ] || { echo "::error::Redis health check failed (docker health status: $STATUS)"; exit 1; }
          echo "✅ Redis is healthy"

      - name: Generate health report
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🏥 Production Health Check Report

          | Service | Status |
          |---------|--------|
          | Backend API | ${{ steps.api-check.outcome == 'success' && '✅ Healthy' || '❌ Unhealthy' }} (HTTP ${{ steps.api-check.outputs.status || 'N/A' }}) |
          | Frontend | ${{ steps.frontend-check.outcome == 'success' && '✅ Healthy' || '❌ Unhealthy' }} (HTTP ${{ steps.frontend-check.outputs.status || 'N/A' }}) |
          | Database | ${{ steps.db-check.outcome == 'success' && '✅ Healthy' || '❌ Unhealthy' }} |
          | Redis | ${{ steps.redis-check.outcome == 'success' && '✅ Healthy' || '❌ Unhealthy' }} |

          **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

      # Every probe above is continue-on-error, so the job only reaches a
      # failed conclusion via this explicit gate.
      - name: Fail the job if any component is down
        if: |
          steps.api-check.outcome != 'success' ||
          steps.frontend-check.outcome != 'success' ||
          steps.db-check.outcome != 'success' ||
          steps.redis-check.outcome != 'success'
        run: exit 1

      - name: Create incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const components = [];
            if ('${{ steps.api-check.outcome }}' !== 'success') components.push('Backend API');
            if ('${{ steps.frontend-check.outcome }}' !== 'success') components.push('Frontend');
            if ('${{ steps.db-check.outcome }}' !== 'success') components.push('Database');
            if ('${{ steps.redis-check.outcome }}' !== 'success') components.push('Redis');

            const title = `🚨 Production Health Check Failed: ${components.join(', ')}`;
            const body = `
            ## Health Check Failure

            **Failed Components**: ${components.join(', ')}

            **Timestamp**: ${new Date().toISOString()}

            ### Check Results

            - Backend API: ${{ steps.api-check.outcome }} (HTTP ${{ steps.api-check.outputs.status || 'N/A' }})
            - Frontend: ${{ steps.frontend-check.outcome }} (HTTP ${{ steps.frontend-check.outputs.status || 'N/A' }})
            - Database: ${{ steps.db-check.outcome }}
            - Redis: ${{ steps.redis-check.outcome }}

            ### Quick Commands (run on the production AP VM)

            \`\`\`bash
            cd ~/scholarship-production
            docker compose ps
            docker compose logs --tail=100 backend
            docker exec scholarship_backend_prod curl -s http://localhost:8000/health
            df -h; free -h
            \`\`\`

            ---
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            // Don't file a fresh issue every 15 minutes during one incident.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production,incident',
              per_page: 5
            });

            const recentIssue = issues.data.find(issue =>
              issue.title.includes('Production Health Check Failed') &&
              (Date.now() - new Date(issue.created_at).getTime()) < 3600000 // Within last hour
            );

            if (recentIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: recentIssue.number,
                body: `Health check failed again at ${new Date().toISOString()}\n\n${body}`
              });
              console.log(`Updated existing issue #${recentIssue.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['production', 'incident', 'urgent']
              });
              console.log(`Created new issue #${issue.data.number}`);
            }

      - name: Close resolved incident issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production,incident',
              per_page: 20
            });
            for (const issue of issues.data) {
              if (!issue.title.includes('Production Health Check Failed')) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ All production health checks are passing again. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
