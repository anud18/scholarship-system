# Production Health Check Workflow
# Copy this file to the PRIVATE production repository at .github/workflows/health-check.yml
#
# Modeled on the PROVEN dev-repo staging-health-monitor.yml. The previous
# version of this file was an unedited placeholder: it curled
# https://api.production.example.com/health (a domain that does not exist, so
# every run reported the backend down) and reached the DB/Redis by SSHing from
# a `ubuntu-latest` runner — which cannot route to the campus VMs at all, the
# same constraint that forced the deploy workflows onto self-hosted runners.
#
# 2026-09-12 incident: this job filed a false 🚨 "production down" issue
# (Backend/Database healthy, Frontend HTTP 400, Redis NOAUTH) even though
# nothing was actually down. Root cause: DOMAIN and REDIS_PASSWORD were only
# set on the `production` GitHub Environment, not as Repository secrets. This
# job deliberately has NO `environment:` key (see Prerequisites below), so it
# can only read Repository-level secrets — an environment-scoped-only value
# resolves to an EMPTY STRING here with no warning. An empty Host header then
# makes nginx itself return 400 (RFC 7230 requires a non-empty Host), and an
# empty REDIS_PASSWORD makes redis-cli skip AUTH entirely, so PING comes back
# "NOAUTH Authentication required" — both indistinguishable from a real outage
# unless you already know to suspect the secret. The frontend/redis steps
# below now guard for this explicitly and fail with a diagnostic message
# instead of a misleading HTTP code, and the incident-issue step files a
# non-paging "misconfigured" issue instead of a 🚨 incident when that's all
# that's wrong.
#
# Prerequisites:
#   - The self-hosted runner registered on the production AP VM, labels
#     [self-hosted, linux, production] (the same runner deploy-production.yml
#     uses). The `production` label is mandatory — the test AP VM also
#     answers to [self-hosted, linux], and probes that landed there would
#     report on the wrong stack. Scheduled, so deliberately NOT behind the
#     `production` environment's approval gate: it only reads.
#   - Secrets: DOMAIN, REDIS_PASSWORD — as REPOSITORY secrets holding the
#     production values (already required by deploy-stack.yml, which reads
#     the same names; see SECRETS-SETUP-GUIDE.md §2). Because this job has no
#     `environment:` key, an environment-scoped-only DOMAIN/REDIS_PASSWORD is
#     invisible to it — it must be able to read them as repository secrets.

name: Production Health Check

on:
  schedule:
    - cron: '0 */12 * * *' # Every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    name: Check Application Health
    # The runner lives ON the production AP VM, so every probe below is a
    # direct localhost/container check — the most direct signal of service
    # availability, with no VPN or SSH hop to fail independently.
    runs-on: [self-hosted, linux, production]
    permissions:
      issues: write
      contents: read

    steps:
      # Backend publishes no host port in production (expose-only), so probe
      # it from inside its own container.
      - name: Check backend API
        id: api-check
        continue-on-error: true
        run: |
          STATUS=$(docker exec scholarship_backend_prod \
            curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            http://localhost:8000/health 2>/dev/null || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [ "$STATUS" = "200" ] || { echo "::error::Backend API health check failed (HTTP $STATUS)"; exit 1; }
          echo "✅ Backend API is healthy (HTTP $STATUS)"

      - name: Check frontend through nginx
        id: frontend-check
        continue-on-error: true
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          # DOMAIN must be a REPOSITORY secret holding the production value —
          # see the 2026-09-12 incident note at the top of this file. Fail
          # loudly and specifically here instead of letting an empty Host
          # header masquerade as a real HTTP 400 outage below.
          if [ -z "${DOMAIN}" ]; then
            echo "::error::DOMAIN secret is empty. It must be a REPOSITORY secret (Settings → Secrets and variables → Actions → Secrets → New repository secret), not only set on the 'production' Environment — this job intentionally has no 'environment:' key (scheduled every 12h; an environment approval gate would block that forever), so it cannot see environment-scoped secrets. See SECRETS-SETUP-GUIDE.md §2."
            echo "status=MISCONFIGURED" >> $GITHUB_OUTPUT
            echo "reason=secret-missing" >> $GITHUB_OUTPUT
            exit 1
          fi

          # End-to-end through the real TLS listener; -k because the probe
          # targets localhost while the certificate is issued for $DOMAIN.
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://localhost/" -H "Host: ${DOMAIN}" || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [ "$STATUS" = "200" ] || { echo "::error::Frontend health check failed (HTTP $STATUS)"; exit 1; }
          echo "✅ Frontend is healthy (HTTP $STATUS)"

      # PostgreSQL lives on the DB VM, not next to the app — there is no
      # `postgres` container here to exec into. /health already opens a real
      # pooled connection and reports the result, so read that verdict.
      - name: Check database connectivity
        id: db-check
        continue-on-error: true
        run: |
          BODY=$(docker exec scholarship_backend_prod \
            curl -s --max-time 10 http://localhost:8000/health 2>/dev/null || echo "{}")
          echo "$BODY"
          echo "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("database",{}).get("status")=="healthy" else 1)' \
            || { echo "::error::Database health check failed"; exit 1; }
          echo "✅ Database is healthy"

      - name: Check Redis cache
        id: redis-check
        continue-on-error: true
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          # Same repository-vs-environment secret trap as DOMAIN above — see
          # the 2026-09-12 incident note at the top of this file. An empty
          # REDIS_PASSWORD makes redis-cli skip AUTH entirely, so PING comes
          # back "NOAUTH Authentication required", indistinguishable from a
          # real Redis outage unless you already know to suspect the secret.
          if [ -z "${REDIS_PASSWORD}" ]; then
            echo "::error::REDIS_PASSWORD secret is empty. It must be a REPOSITORY secret (Settings → Secrets and variables → Actions → Secrets → New repository secret), not only set on the 'production' Environment — this job intentionally has no 'environment:' key (scheduled every 12h; an environment approval gate would block that forever), so it cannot see environment-scoped secrets. See SECRETS-SETUP-GUIDE.md §2."
            echo "reason=secret-missing" >> $GITHUB_OUTPUT
            exit 1
          fi

          PONG=$(docker exec scholarship_redis_prod \
            redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping 2>/dev/null || echo "")
          [ "$PONG" = "PONG" ] || { echo "::error::Redis health check failed (got '$PONG')"; exit 1; }
          echo "✅ Redis is healthy"

      - name: Generate health report
        if: always()
        env:
          API_OUTCOME: ${{ steps.api-check.outcome }}
          API_STATUS: ${{ steps.api-check.outputs.status }}
          FRONTEND_OUTCOME: ${{ steps.frontend-check.outcome }}
          FRONTEND_STATUS: ${{ steps.frontend-check.outputs.status }}
          DB_OUTCOME: ${{ steps.db-check.outcome }}
          REDIS_OUTCOME: ${{ steps.redis-check.outcome }}
        run: |
          # A plain bash helper reads far more clearly here than nesting the
          # MISCONFIGURED case into a wall of GitHub Actions ternaries.
          row() {
            local outcome="$1" label="$2" status="${3:-}"
            if [ "$status" = "MISCONFIGURED" ]; then
              echo "| $label | ⚠️ Misconfigured — required secret missing (see job log) |"
            elif [ "$outcome" = "success" ]; then
              if [ -n "$status" ]; then
                echo "| $label | ✅ Healthy (HTTP $status) |"
              else
                echo "| $label | ✅ Healthy |"
              fi
            else
              if [ -n "$status" ]; then
                echo "| $label | ❌ Unhealthy (HTTP $status) |"
              else
                echo "| $label | ❌ Unhealthy |"
              fi
            fi
          }
          {
            echo "# 🏥 Production Health Check Report"
            echo ""
            echo "| Service | Status |"
            echo "|---------|--------|"
            row "$API_OUTCOME" "Backend API" "$API_STATUS"
            row "$FRONTEND_OUTCOME" "Frontend" "$FRONTEND_STATUS"
            row "$DB_OUTCOME" "Database"
            row "$REDIS_OUTCOME" "Redis"
            echo ""
            echo "**Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      # Every probe above is continue-on-error, so the job only reaches a
      # failed conclusion via this explicit gate.
      - name: Fail the job if any component is down
        if: |
          steps.api-check.outcome != 'success' ||
          steps.frontend-check.outcome != 'success' ||
          steps.db-check.outcome != 'success' ||
          steps.redis-check.outcome != 'success'
        run: exit 1

      - name: Create incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const results = [
              { name: 'Backend API', outcome: '${{ steps.api-check.outcome }}', reason: '' },
              { name: 'Frontend', outcome: '${{ steps.frontend-check.outcome }}', reason: '${{ steps.frontend-check.outputs.reason }}' },
              { name: 'Database', outcome: '${{ steps.db-check.outcome }}', reason: '' },
              { name: 'Redis', outcome: '${{ steps.redis-check.outcome }}', reason: '${{ steps.redis-check.outputs.reason }}' },
            ];
            const failedComponents = results.filter(r => r.outcome !== 'success');
            const components = failedComponents.map(r => r.name);

            // Distinguish "a required secret is only on the Environment, not
            // the Repository" (a one-time config gap — see the 2026-09-12
            // incident note in health-check.yml) from an actual outage, so a
            // misconfiguration doesn't page on-call as a 🚨 production
            // incident every 12 hours until someone notices.
            const allMisconfigured = failedComponents.length > 0 &&
              failedComponents.every(r => r.reason === 'secret-missing');

            const title = allMisconfigured
              ? `⚙️ Production Health Check Misconfigured: missing repository secret(s) for ${components.join(', ')}`
              : `🚨 Production Health Check Failed: ${components.join(', ')}`;

            const misconfigNote = allMisconfigured
              ? `\n**This is NOT a service outage.** The failing check(s) above need a secret that is currently only set on the \`production\` GitHub Environment. \`health-check.yml\` deliberately has no \`environment:\` key (it is scheduled every 12h, and an environment approval gate would block that forever), so it can only read **Repository** secrets. Add the missing secret(s) as Repository secrets holding the production value (Settings → Secrets and variables → Actions → Secrets → New repository secret) — see SECRETS-SETUP-GUIDE.md §2.\n`
              : '';

            const body = `
            ## Health Check Failure
            ${misconfigNote}
            **Failed Components**: ${components.join(', ')}

            **Timestamp**: ${new Date().toISOString()}

            ### Check Results

            - Backend API: ${{ steps.api-check.outcome }} (HTTP ${{ steps.api-check.outputs.status || 'N/A' }})
            - Frontend: ${{ steps.frontend-check.outcome }} (HTTP ${{ steps.frontend-check.outputs.status || 'N/A' }})
            - Database: ${{ steps.db-check.outcome }}
            - Redis: ${{ steps.redis-check.outcome }}

            ### Quick Commands (run on the production AP VM)

            \`\`\`bash
            cd ~/scholarship-production
            docker compose ps
            docker compose logs --tail=100 backend
            docker exec scholarship_backend_prod curl -s http://localhost:8000/health
            df -h; free -h
            \`\`\`

            ---
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            const labels = allMisconfigured
              ? ['production', 'config']
              : ['production', 'incident', 'urgent'];

            // Don't file a fresh issue every 15 minutes during one incident.
            // Matches both title variants ("Failed" / "Misconfigured") so a
            // recurring misconfig also just gets a comment, not a new issue.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production',
              per_page: 20
            });

            const recentIssue = issues.data.find(issue =>
              issue.title.includes('Production Health Check') &&
              (Date.now() - new Date(issue.created_at).getTime()) < 3600000 // Within last hour
            );

            if (recentIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: recentIssue.number,
                body: `Health check failed again at ${new Date().toISOString()}\n\n${body}`
              });
              console.log(`Updated existing issue #${recentIssue.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: labels
              });
              console.log(`Created new issue #${issue.data.number}`);
            }

      - name: Close resolved incident issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production',
              per_page: 20
            });
            for (const issue of issues.data) {
              // Matches both title variants ("Failed" / "Misconfigured").
              if (!issue.title.includes('Production Health Check')) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ All production health checks are passing again. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
