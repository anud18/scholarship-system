# CodeQL Configuration
# Security analysis configuration for scholarship system

name: "CodeQL Security Configuration"

# Disable default queries to use only specified ones
disable-default-queries: false

# Query packs to run
packs:
  - codeql/python-queries
  - codeql/javascript-queries

# SUPPRESSED ALERTS
#
# CodeQL does NOT support inline comment suppressions (e.g., `# lgtm[...]`,
# `# codeql[...]`). File-specific query exclusions are handled via the
# filter-sarif GitHub Action steps ("Filter ... SARIF") in
# .github/workflows/codeql.yml.
#
# Current suppressions (via filter-sarif):
#
# (RESOLVED — suppression removed) py/regex-injection in
# backend/app/core/regex_validator.py used to be suppressed here as a false
# positive. validate_and_sanitize_pattern() now rebuilds every pattern
# character-by-character from a constant allowlist map before compilation, so
# the string reaching re.compile() is assembled from trusted constants and the
# taint flow genuinely terminates — CodeQL no longer flags it, no suppression
# needed. If the module is restructured and the alert returns, prefer keeping
# the allowlist rebuild as the barrier over re-adding a filter-sarif pattern.
#
# 1. py/stack-trace-exposure in backend/app/api/v1/endpoints/admin/bank_verification.py
#
# JUSTIFICATION FOR SUPPRESSION:
# This is a false positive. The code has multiple layers of protection:
#
# Security Measures:
#   - sanitize_error_string() detects and removes stack trace patterns
#   - sanitize_dict() recursively sanitizes nested structures
#   - JSON round-trip creates new objects, breaks taint flow
#   - Pydantic field validators check for stack traces at serialization
#   - Exception handlers return only generic user-friendly messages
#
# No stack trace information can reach the API response due to these
# comprehensive defense-in-depth measures. The warning is a limitation
# of static analysis not recognizing our custom sanitization pipeline.

# Paths to analyze
paths:
  - backend/app
  - frontend

# Paths to ignore
paths-ignore:
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/node_modules/**"
  - "**/.venv/**"
