name: Mirror to Production Repo

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本遞增類型（用於 Release Notes）'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      pr_title:
        description: 'Pull Request 標題（選填，預設會自動生成）'
        required: false
        type: string

      freeze_workflows:
        description: '凍結 prod repo 的 workflows：跳過「pristine 舊模板自動更新」（例如 prod 端剛刻意 rollback 某個 workflow 時使用）'
        required: false
        type: boolean
        default: false

      security_reports:
        description: '產生本次版本的資安報告（ZAP baseline + CodeQL PDF）並附到 production PR'
        required: false
        type: boolean
        default: true

      skip_image_tagging:
        description: '跳過 GHCR 版本標籤（僅在此 commit 尚未建置映像、但仍需先開 PR 時勾選；勾選後 production 將沒有 vX.Y.Z 映像可部署）'
        required: false
        type: boolean
        default: false

# SECURITY: Limit GITHUB_TOKEN permissions to minimum required
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write  # Need write for creating/updating production branch

jobs:
  # ---------------------------------------------------------------------------
  # Security evidence for the exact commit being shipped.
  #
  # The reports are published as ARTIFACTS ON THIS WORKFLOW RUN (each reusable
  # workflow uploads its own; see the run's Artifacts section). Nothing is
  # committed into the sync payload and nothing is posted to the production PR —
  # the production repo's PR content is intentionally unchanged.
  #
  # These run IN PARALLEL with sync-to-production rather than gating it: a scan
  # takes tens of minutes, and blocking the mirror on it would make releases
  # slow without making them safer. They are also deliberately NOT `needs`-ed by
  # the sync job, so a scanner hiccup can never block a release.
  # ---------------------------------------------------------------------------
  zap-report:
    name: ZAP baseline report
    if: github.event_name == 'workflow_dispatch' && inputs.security_reports
    uses: ./.github/workflows/zap-report.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  codeql-report:
    name: CodeQL PDF report
    if: github.event_name == 'workflow_dispatch' && inputs.security_reports
    uses: ./.github/workflows/sarif-to-pdf.yml
    with:
      # Report on the commit being mirrored, not merely the newest scan.
      sha: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  sync-to-production:
    name: Sync to Production Repository
    runs-on: ubuntu-latest
    # Only run if secrets are configured
    if: github.event_name == 'workflow_dispatch'

    # Overrides the workflow-level block, so `contents: write` has to be
    # restated here. `packages: write` is what lets the "Tag release images"
    # step below add the vX.Y.Z tag to the GHCR images (the GH_PAT is used
    # when present; this is the GITHUB_TOKEN fallback).
    permissions:
      contents: write
      packages: write

    # Directory owned by the production repository. The mirror neither pushes
    # development content into it nor deletes what production keeps there.
    env:
      PROTECTED_DOCS_DIR: docs/資訊中心文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for proper merging
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for required secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::error::GH_PAT secret not configured"
            echo "::error::Please configure GH_PAT with write access to production repo"
            exit 1
          fi

          if [ -z "${{ secrets.PRODUCTION_REPO }}" ]; then
            echo "::error::PRODUCTION_REPO secret not configured"
            echo "::error::Please set PRODUCTION_REPO to format: owner/repo-name"
            exit 1
          fi

          # The mirror pushes .github/workflows/** whenever a template is
          # installed or a pristine-stale prod copy is auto-updated — a classic
          # PAT must carry the `workflow` scope or the final push is rejected
          # with "refusing to allow a Personal Access Token to create or
          # update workflow". Fail fast HERE with an actionable message.
          # Fine-grained PATs do not expose x-oauth-scopes; warn instead.
          SCOPES=$(curl -sI -H "Authorization: token ${{ secrets.GH_PAT }}" https://api.github.com/user | tr -d '\r' | grep -i '^x-oauth-scopes:' || true)
          if [ -n "$SCOPES" ] && ! echo "$SCOPES" | grep -qw "workflow"; then
            echo "::error::GH_PAT lacks the 'workflow' scope — pushing .github/workflows/** to the production repo will be rejected."
            echo "::error::Re-issue the PAT with 'repo' + 'workflow' scopes (see .github/PRODUCTION_SYNC_GUIDE.md)."
            exit 1
          fi
          # Same idea for GHCR: the mirror tags the release images with the
          # version number (see "Tag release images in GHCR"), which a classic
          # PAT can only do with the `write:packages` scope. Catch it here
          # rather than after the whole sync has already run.
          if [ "${{ inputs.skip_image_tagging }}" != "true" ] && [ -n "$SCOPES" ] && ! echo "$SCOPES" | grep -qw "write:packages"; then
            echo "::error::GH_PAT lacks the 'write:packages' scope — the release version tag cannot be published to GHCR."
            echo "::error::Re-issue the PAT with 'repo' + 'workflow' + 'write:packages' scopes,"
            echo "::error::or dispatch with skip_image_tagging=true to release without a version-tagged image."
            exit 1
          fi
          if [ -z "$SCOPES" ]; then
            echo "::warning::Could not read x-oauth-scopes (fine-grained PAT?) — ensure the token has the 'Workflows' repository permission (read and write) on the production repo, and 'Packages' (read and write) for the release image tag."
          fi

          echo "configured=true" >> $GITHUB_OUTPUT

      - name: Initialize or switch to production branch
        run: |
          echo "::group::Initialize production branch"

          # Fetch all branches
          git fetch origin

          # Check if production branch exists locally or remotely
          if git show-ref --verify --quiet refs/heads/production; then
            echo "::notice::Production branch exists locally, checking out"
            git checkout production
          elif git show-ref --verify --quiet refs/remotes/origin/production; then
            echo "::notice::Production branch exists remotely, checking out"
            git checkout -b production origin/production
          else
            echo "::notice::Creating new production branch from main"
            git checkout -b production
          fi

          echo "::endgroup::"

      - name: Sync from production repository
        env:
          PRODUCTION_REPO: ${{ secrets.PRODUCTION_REPO }}
          PRODUCTION_BRANCH: ${{ secrets.PRODUCTION_BRANCH || 'main' }}
        run: |
          echo "::group::Syncing from production repository"

          # Add production repo as remote (for later push, not for merge)
          echo "::notice::Adding production repository as remote"
          git remote add prod-repo "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${PRODUCTION_REPO}.git" 2>/dev/null || true

          # SKIP merge from production repo to avoid file content conflicts
          # The production repo contains squashed commits with same file states as dev repo
          # Merging would cause Git to think there are no new changes in Step 6
          echo "::notice::Skipping merge from production repository (not needed for one-way sync)"
          echo "PROD_SYNC_COMMITS=Skipped (one-way sync from dev to prod)" >> $GITHUB_ENV

          # Still fetch for reference (not for merge)
          if git fetch prod-repo "${PRODUCTION_BRANCH}" 2>/dev/null; then
            echo "::notice::Production repository fetched successfully (for reference only)"

            # Verify prod-repo/main is available for baseline tracking
            if git rev-parse prod-repo/main >/dev/null 2>&1; then
              PROD_MAIN_SHA=$(git rev-parse --short prod-repo/main)
              echo "::notice::prod-repo/main available for baseline tracking (SHA: $PROD_MAIN_SHA)"
            else
              echo "::warning::prod-repo/main not found, will use origin/production as fallback"
            fi
          else
            echo "::notice::Production repository not found or first sync"
            echo "::notice::This is expected for first-time setup"
          fi

          echo "::endgroup::"

      - name: Merge latest from main branch
        run: |
          echo "::group::Merging latest from main"

          # Get current HEAD before merge
          BEFORE_MERGE=$(git rev-parse HEAD)

          # Fetch and merge main
          git fetch origin main
          echo "::notice::Merging latest changes from main branch"

          if git merge origin/main --allow-unrelated-histories -X theirs -m "chore: merge latest from main

          Merged latest development changes from main branch
          Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          " 2>&1 | tee /tmp/merge-main-output.txt; then
            # Merge succeeded
            AFTER_MERGE=$(git rev-parse HEAD)
            if [ "$BEFORE_MERGE" != "$AFTER_MERGE" ]; then
              echo "::notice::✅ Merged changes from main"

              # Show what was merged
              echo "::notice::Changes from main:"
              git log --oneline "${BEFORE_MERGE}..${AFTER_MERGE}" | head -10 || true

              # Save for release notes
              echo "MAIN_MERGE_COMMITS<<EOF" >> $GITHUB_ENV
              git log --format="- %s (%an, %ar)" "${BEFORE_MERGE}..origin/main" | head -20
              echo "EOF" >> $GITHUB_ENV
            else
              echo "::notice::No new changes from main branch"
              echo "MAIN_MERGE_COMMITS=No new changes from main" >> $GITHUB_ENV
            fi
          else
            # Merge failed - auto-resolve conflicts
            echo "::warning::Merge encountered conflicts, auto-resolving..."

            # Check if conflict is in .github/workflows/
            if grep -q ".github/workflows/" /tmp/merge-main-output.txt; then
              echo "::notice::Detected .github/workflows/ conflict (expected)"
              echo "::notice::Accepting main's version (will be removed in next step)"
            fi

            # Accept main's version for all conflicts
            # This is safe because:
            # 1. .github/workflows/ will be removed in next step anyway
            # 2. Other files should take the latest version from main
            git checkout --theirs . 2>/dev/null || true
            git add -A

            if git commit -m "chore: merge latest from main (auto-resolved conflicts)

            Merged latest development changes from main branch
            Conflicts auto-resolved by accepting main's version
            Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            "; then
              echo "::notice::✅ Conflicts resolved and committed"

              # Save for release notes
              AFTER_MERGE=$(git rev-parse HEAD)
              echo "MAIN_MERGE_COMMITS<<EOF" >> $GITHUB_ENV
              git log --format="- %s (%an, %ar)" "${BEFORE_MERGE}..origin/main" | head -20
              echo "(Conflicts auto-resolved)"
              echo "EOF" >> $GITHUB_ENV
            else
              echo "::notice::No conflicts to resolve (clean state)"
              echo "MAIN_MERGE_COMMITS=No new changes from main" >> $GITHUB_ENV
            fi
          fi

          echo "::endgroup::"

      - name: Remove files deleted in main
        run: |
          echo "::group::Removing files deleted in main"

          # The merge above runs with --allow-unrelated-histories: the
          # production branch shares no ancestor with main, so a file that
          # exists only on the production side is silently kept. Files deleted
          # in development (e.g. frontend/package-lock.json after the bun
          # migration) therefore survive in production forever and keep feeding
          # Dependabot alerts from stale manifests. Reconcile by removing every
          # tracked file that no longer exists in origin/main. Production-only
          # workflows removed here are re-installed from the production repo by
          # the "Preserve production workflows" / template steps below.
          # NUL-delimited listings: -z disables C-quoting entirely, so paths
          # containing non-ASCII, quotes, backslashes or spaces compare
          # byte-for-byte and reach git rm as real paths.
          git ls-files -z > /tmp/production-tracked-files-raw.z
          git ls-tree -r -z --name-only origin/main > /tmp/main-tracked-files-raw.z

          # Refuse to reconcile against an empty main listing — an empty file
          # here would classify EVERY production file as stale and wipe the tree.
          if [ ! -s /tmp/main-tracked-files-raw.z ]; then
            echo "::error::origin/main file listing is empty; refusing to reconcile deletions"
            exit 1
          fi

          LC_ALL=C sort -z /tmp/production-tracked-files-raw.z > /tmp/production-tracked-files.z
          LC_ALL=C sort -z /tmp/main-tracked-files-raw.z > /tmp/main-tracked-files.z
          LC_ALL=C comm -z -23 /tmp/production-tracked-files.z /tmp/main-tracked-files.z > /tmp/stale-files-all.z

          # $PROTECTED_DOCS_DIR belongs to the production repository — the
          # "Preserve production docs" step below restores it verbatim, so a
          # file living only under it is production-owned content, not the
          # leftover of a deletion in main. Without this filter every sync
          # deletes the ops handbooks and their screenshots. grep exits 1 when
          # every stale path was protected, which is not an error here.
          grep -z -v "^${PROTECTED_DOCS_DIR}/" /tmp/stale-files-all.z > /tmp/stale-files.z || true

          # Newline-delimited copy for logs and release notes (display only —
          # git rm consumes the NUL-delimited list).
          tr '\0' '\n' < /tmp/stale-files.z > /tmp/stale-files.txt

          if [ -s /tmp/stale-files.z ]; then
            STALE_COUNT=$(wc -l < /tmp/stale-files.txt)
            echo "::notice::Removing ${STALE_COUNT} stale file(s) deleted in main:"
            cat /tmp/stale-files.txt
            # :(literal) disables pathspec globbing so a path containing
            # * ? [ ] cannot over-delete unrelated files.
            sed -z 's/^/:(literal)/' /tmp/stale-files.z | xargs -0 git rm -f -q --

            git commit -m "chore: remove files deleted in main

            The unrelated-history merge cannot propagate deletions, so files
            removed from the development repository are reconciled explicitly.

            Removed files: ${STALE_COUNT}
            Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            "
            echo "::notice::✅ Removed ${STALE_COUNT} stale file(s)"
          else
            echo "::notice::No stale files to remove"
          fi

          echo "::endgroup::"

      - name: Stage production workflow templates
        # The mirror strips .github/workflows AND production-workflows-examples
        # from the tree, but this workflow is the ONLY channel into the private
        # prod repo — its CI/CD has to be carried over from here. Stage the
        # templates before the removal steps so the install step (after
        # production-workflow preservation) can seed them.
        run: |
          echo "::group::Staging production workflow templates"
          rm -rf /tmp/prod-workflow-templates
          if [ -d ".github/production-workflows-examples" ]; then
            cp -r .github/production-workflows-examples /tmp/prod-workflow-templates
            echo "::notice::Staged $(ls /tmp/prod-workflow-templates | wc -l) template file(s)"
          else
            echo "::warning::.github/production-workflows-examples not found — nothing to stage"
          fi
          echo "::endgroup::"

      - name: Remove development workflows
        run: |
          echo "::group::Removing development workflows"

          # Remove .github/workflows directory
          if [ -d ".github/workflows" ]; then
            echo "::notice::Removing .github/workflows/ directory"

            # List files being removed
            echo "::notice::Files to be removed:"
            find .github/workflows -type f -name "*.yml" -o -name "*.yaml" | tee /tmp/removed-workflows.txt

            git rm -rf .github/workflows/

            # Count removed files
            REMOVED_COUNT=$(wc -l < /tmp/removed-workflows.txt || echo "0")
            echo "::notice::Removed $REMOVED_COUNT workflow file(s)"
            echo "REMOVED_WORKFLOWS_COUNT=$REMOVED_COUNT" >> $GITHUB_ENV

            # Save list for release notes
            echo "REMOVED_WORKFLOWS<<EOF" >> $GITHUB_ENV
            cat /tmp/removed-workflows.txt || echo "None"
            echo "EOF" >> $GITHUB_ENV
          else
            echo "::notice::No .github/workflows/ directory found"
            echo "REMOVED_WORKFLOWS_COUNT=0" >> $GITHUB_ENV
            echo "REMOVED_WORKFLOWS=No workflows to remove" >> $GITHUB_ENV
          fi

          # If .github directory is now empty, remove it
          if [ -d ".github" ] && [ -z "$(ls -A .github 2>/dev/null)" ]; then
            echo "::notice::Removing empty .github/ directory"
            git rm -rf .github/
          fi

          # Commit the removal
          if git diff --cached --quiet; then
            echo "::notice::No workflows to remove"
          else
            git commit -m "chore: remove development workflows for production

            Development workflows are not needed in production repository.
            Production repo will maintain its own deployment and monitoring workflows.

            Removed workflows: ${REMOVED_WORKFLOWS_COUNT} files
            Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            "
            echo "::notice::✅ Committed workflow removal"
          fi

          echo "::endgroup::"

      - name: Remove development-only directories
        run: |
          echo "::group::Removing development-only directories"

          REMOVED_DIRS=""

          # Remove .github/codeql directory
          if [ -d ".github/codeql" ]; then
            echo "::notice::Removing .github/codeql/ directory"
            git rm -rf .github/codeql/
            REMOVED_DIRS="${REMOVED_DIRS}- .github/codeql/ (CodeQL configuration)\n"
          fi

          # Remove .github/production-workflows-examples directory
          if [ -d ".github/production-workflows-examples" ]; then
            echo "::notice::Removing .github/production-workflows-examples/ directory"
            git rm -rf .github/production-workflows-examples/
            REMOVED_DIRS="${REMOVED_DIRS}- .github/production-workflows-examples/ (Production workflows examples)\n"
          fi

          # Remove mock-student-api (development only)
          if [ -d "mock-student-api" ]; then
            echo "::notice::Removing mock-student-api/ directory"
            git rm -rf mock-student-api/
            REMOVED_DIRS="${REMOVED_DIRS}- mock-student-api/ (Mock Student API)\n"
          fi

          # Remove .claude directory (Claude Code project configuration)
          if [ -d ".claude" ]; then
            echo "::notice::Removing .claude/ directory"
            git rm -rf .claude/
            REMOVED_DIRS="${REMOVED_DIRS}- .claude/ (Claude Code configuration)\n"
          fi

          # Remove docker-compose variants (keep production files)
          echo "::notice::Removing non-production docker-compose variant files"
          for file in docker-compose.*.yml; do
            if [ -f "$file" ]; then
              # Keep production-related docker-compose files
              if [[ "$file" == "docker-compose.prod.yml" ]] || \
                 [[ "$file" == "docker-compose.prod-db.yml" ]] || \
                 [[ "$file" == "docker-compose.prod-db-monitoring.yml" ]]; then
                echo "::notice::Preserving $file (production file)"
              else
                echo "::notice::Removing $file"
                git rm "$file" 2>/dev/null || true
                REMOVED_DIRS="${REMOVED_DIRS}- $file (Docker Compose variant)\n"
              fi
            fi
          done

          # Remove subdirectory docker-compose files (except monitoring and production)
          find . -type f -name "docker-compose*.yml" 2>/dev/null | while read file; do
            if [[ "$file" != "./monitoring/"* ]] && \
               [[ "$file" != "./docker-compose.prod.yml" ]] && \
               [[ "$file" != "./docker-compose.prod-db.yml" ]] && \
               [[ "$file" != "./docker-compose.prod-db-monitoring.yml" ]]; then
              echo "::notice::Removing $file"
              git rm "$file" 2>/dev/null || true
              REMOVED_DIRS="${REMOVED_DIRS}- $file (Docker Compose file)\n"
            fi
          done

          # Remove test directories
          echo "::notice::Removing test directories"
          git rm -rf frontend/__tests__/ 2>/dev/null || true
          git rm -rf frontend/components/__tests__/ 2>/dev/null || true
          git rm -rf frontend/hooks/__tests__/ 2>/dev/null || true
          git rm -rf frontend/lib/__tests__/ 2>/dev/null || true
          git rm -rf frontend/lib/api/__tests__/ 2>/dev/null || true
          git rm -rf frontend/lib/utils/__tests__/ 2>/dev/null || true
          git rm -rf backend/app/tests/ 2>/dev/null || true
          git rm -rf frontend/e2e/ 2>/dev/null || true

          if git diff --cached --quiet --name-only | grep -q "__tests__\|/tests/"; then
            REMOVED_DIRS="${REMOVED_DIRS}- Test directories (__tests__/, tests/, e2e/)\n"
          fi

          # Remove test files
          echo "::notice::Removing test files"
          find . -type f \( -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.test.py" -o -name "test_*.py" \) 2>/dev/null | \
            xargs -r git rm -f 2>/dev/null || true

          if git diff --cached --quiet --name-only | grep -q "\.test\.\|test_"; then
            REMOVED_DIRS="${REMOVED_DIRS}- Test files (*.test.*, test_*.py)\n"
          fi

          # Remove test configuration files
          echo "::notice::Removing test configuration files"
          git rm -f frontend/jest.config.js 2>/dev/null || true
          git rm -f frontend/jest.config.standalone.js 2>/dev/null || true
          git rm -f frontend/tsconfig.test.json 2>/dev/null || true
          git rm -f frontend/playwright.config.ts 2>/dev/null || true
          git rm -f backend/pytest.ini 2>/dev/null || true
          git rm -f backend/.coverage 2>/dev/null || true

          if git diff --cached --quiet --name-only | grep -q "jest.config\|pytest.ini\|\.coverage"; then
            REMOVED_DIRS="${REMOVED_DIRS}- Test configuration files\n"
          fi

          # Remove dev-only environment bootstrap script (writes local-dev .env
          # files; useless in production, and its dev DB/S3 defaults trip
          # credential scanners run against the production repo)
          echo "::notice::Removing dev-only scripts"
          if git rm -f scripts/write_dev_env.sh 2>/dev/null; then
            REMOVED_DIRS="${REMOVED_DIRS}- scripts/write_dev_env.sh (dev-only .env bootstrap)\n"
          fi

          # Remove all markdown documentation files
          echo "::notice::Removing markdown documentation files"
          find . -type f -name "*.md" -not -path './monitoring/*' 2>/dev/null | xargs -r git rm -f 2>/dev/null || true

          if git diff --cached --quiet --name-only | grep -q "\.md$"; then
            REMOVED_DIRS="${REMOVED_DIRS}- Documentation files (*.md)\n"
          fi

          # Save for release notes
          if [ -n "$REMOVED_DIRS" ]; then
            echo "REMOVED_DIRS<<EOF" >> $GITHUB_ENV
            echo -e "$REMOVED_DIRS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "REMOVED_DIRS=No development directories to remove" >> $GITHUB_ENV
          fi

          # Commit the removal
          if git diff --cached --quiet; then
            echo "::notice::No development directories to remove"
          else
            git commit -m "chore: remove development-only directories for production

            Development directories are not needed in production:
            $(echo -e "$REMOVED_DIRS")

            Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            "
            echo "::notice::✅ Committed development directories removal"
          fi

          echo "::endgroup::"

      - name: Preserve production docs
        env:
          PRODUCTION_BRANCH: ${{ secrets.PRODUCTION_BRANCH || 'main' }}
        run: |
          echo "::group::Preserving ${PROTECTED_DOCS_DIR}/"

          # The ops handbooks under $PROTECTED_DOCS_DIR (installation, stop,
          # restore, update) plus their screenshots are written for whoever runs
          # the production site and have no counterpart in main, so the mirror
          # must neither push development content over them nor delete them.
          # The rest of docs/ keeps syncing from main as before. Drop whatever
          # the merge brought into this one directory, then restore
          # production's own tree verbatim, which makes it a no-op in every
          # sync PR.
          if [ -d "${PROTECTED_DOCS_DIR}" ]; then
            git rm -rq --ignore-unmatch -- "${PROTECTED_DOCS_DIR}/" || true
            rm -rf "${PROTECTED_DOCS_DIR}"
          fi

          if git rev-parse --verify --quiet "prod-repo/${PRODUCTION_BRANCH}:${PROTECTED_DOCS_DIR}" >/dev/null; then
            git archive "prod-repo/${PRODUCTION_BRANCH}" "${PROTECTED_DOCS_DIR}" | tar -x
            git add -- "${PROTECTED_DOCS_DIR}/"
            DOC_COUNT=$(git ls-files -- "${PROTECTED_DOCS_DIR}/" | wc -l)
            echo "::notice::Restored ${DOC_COUNT} file(s) under ${PROTECTED_DOCS_DIR}/ from the production repository"
          else
            echo "::notice::Production repository has no ${PROTECTED_DOCS_DIR}/ — nothing to restore"
          fi

          if git diff --cached --quiet; then
            echo "::notice::${PROTECTED_DOCS_DIR}/ already matches the production repository"
          else
            git commit -m "chore: keep the ops handbooks owned by production

            ${PROTECTED_DOCS_DIR}/ is maintained in the production repository
            and is not mirrored from development. Anything the merge brought
            into it is dropped and the production tree is restored unchanged.

            Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            "
            echo "::notice::✅ ${PROTECTED_DOCS_DIR}/ restored from the production repository"
          fi

          echo "::endgroup::"

      - name: Preserve production workflows
        id: preserve-workflows
        continue-on-error: true
        env:
          PRODUCTION_REPO: ${{ secrets.PRODUCTION_REPO }}
          PRODUCTION_BRANCH: ${{ secrets.PRODUCTION_BRANCH || 'main' }}
        run: |
          echo "::group::Preserving production workflows"

          # Try to fetch production workflows
          echo "::notice::Fetching production workflows..."
          if git ls-tree -r prod-repo/${PRODUCTION_BRANCH} --name-only 2>/dev/null | grep -q "^.github/workflows/"; then
            echo "::notice::Production has workflows, preserving them..."

            # Create temp directory
            mkdir -p /tmp/production-workflows

            # Extract production workflows to temp
            git archive prod-repo/${PRODUCTION_BRANCH} .github/workflows | tar -x -C /tmp/production-workflows 2>/dev/null || true

            # Copy production workflows back
            if [ -d "/tmp/production-workflows/.github/workflows" ]; then
              mkdir -p .github/workflows
              cp -r /tmp/production-workflows/.github/workflows/* .github/workflows/ 2>/dev/null || true

              WORKFLOW_COUNT=$(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) 2>/dev/null | wc -l)
              echo "::notice::✅ Preserved $WORKFLOW_COUNT production workflow(s)"

              # List preserved workflows
              echo "::notice::Preserved workflows:"
              find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) -exec basename {} \; || true

              # Add to git
              git add .github/workflows/

              # Commit preservation
              if ! git diff --cached --quiet; then
                git commit -m "chore: preserve production workflows

                Preserved ${WORKFLOW_COUNT} workflow(s) from production repository
                Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                "
                echo "::notice::✅ Production workflows preserved and committed"
              fi

              echo "preserved_count=$WORKFLOW_COUNT" >> $GITHUB_OUTPUT
            else
              echo "::notice::No production workflows found to preserve"
              echo "preserved_count=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "::notice::Production repo has no .github/workflows/ directory"
            echo "preserved_count=0" >> $GITHUB_OUTPUT
          fi

          # Cleanup temp directory
          rm -rf /tmp/production-workflows

          echo "::endgroup::"

      - name: Install production workflows from templates
        id: install-workflows
        env:
          PRESERVED_COUNT: ${{ steps.preserve-workflows.outputs.preserved_count }}
          FREEZE_WORKFLOWS: ${{ inputs.freeze_workflows }}
        run: |
          echo "::group::Installing production workflows from templates"

          # Bootstrap + drift policy:
          #   - A workflow file the prod repo does NOT have yet is installed
          #     from the staged templates (first mirror seeds the whole CI/CD).
          #   - A preserved prod copy that is byte-identical to SOME historical
          #     revision of its template (checked against the dev history at
          #     GITHUB_SHA) was never customized on the prod side — it is just
          #     a stale template, so it IS updated to the current template.
          #     This is what lets template fixes (e.g. the permissions blocks
          #     from #1282) actually reach production through the mirror.
          #   - A preserved prod copy matching NO template revision carries
          #     prod-side customizations — never overwritten; we only surface
          #     a notice so the diff can be ported deliberately.
          #
          # NOTE: pushing .github/workflows/** to the prod repo requires the
          # GH_PAT to carry the `workflow` scope — without it the push step
          # fails with "refusing to allow a Personal Access Token to create or
          # update workflow".
          INSTALLED=""
          UPDATED=""
          SKIPPED=""
          DIFFERS=""

          if [ ! -d /tmp/prod-workflow-templates ]; then
            echo "::warning::No staged templates — skipping install"
            echo "installed=" >> $GITHUB_OUTPUT
            echo "updated=" >> $GITHUB_OUTPUT
            echo "customized=" >> $GITHUB_OUTPUT
            echo "::endgroup::"
            exit 0
          fi

          mkdir -p .github/workflows

          # Carry over ONLY the executable CI/CD — the .yml workflows. The
          # prod repo's security scanning is strict, so we do NOT push the
          # setup guides (SECRETS-SETUP-GUIDE.md etc. are full of example
          # secret values + `gh secret set` snippets that trip secret
          # scanners). Operators read those guides in the DEV repo's
          # .github/production-workflows-examples/ — they already have access
          # there since they dispatch this mirror.
          # deploy-stack.yml is the reusable stage body that BOTH deploy-test.yml
          # and deploy-production.yml call with
          # `uses: ./.github/workflows/deploy-stack.yml` — shipping either
          # caller without it leaves the prod repo with an unresolvable workflow.
          # stop-test.yml / stop-production.yml / stop-stack.yml are the same
          # arrangement for taking a stage OFFLINE, and ship as their own trio.
          # deploy-monitoring-{test,production,stack}.yml is a third trio, for
          # the observability stack: docker-compose.prod.yml ships only the
          # COLLECTORS (Alloy + exporters), which push to monitoring_loki /
          # monitoring_prometheus — Docker DNS names that resolve only once
          # monitoring/docker-compose.monitoring.yml is up on that same VM. That
          # compose file is mirrored (see the docker-compose strip step, which
          # exempts ./monitoring/), but nothing in the prod repo ever started it,
          # so prod Alloy dropped every batch and nginx's /monitoring proxy had
          # no upstream. These three workflows are what start it.
          for f in deploy-test.yml deploy-production.yml deploy-stack.yml stop-test.yml stop-production.yml stop-stack.yml deploy-monitoring-test.yml deploy-monitoring-production.yml deploy-monitoring-stack.yml health-check.yml backup.yml auto-tag-on-merge.yml setting-env.yml; do
            src="/tmp/prod-workflow-templates/$f"
            [ -f "$src" ] || continue
            dest=".github/workflows/$f"
            if [ -f "$dest" ]; then
              if cmp -s "$src" "$dest"; then
                SKIPPED="$SKIPPED $f"
              else
                # Provenance check: does the preserved prod copy match ANY
                # historical revision of the template? Byte-identical to one
                # → never customized on the prod side → safe to update.
                # CAVEAT: a deliberate prod-side rollback TO a historical
                # template revision is indistinguishable from staleness — it
                # would be re-upgraded here. Dispatch with
                # freeze_workflows=true to hold workflows back in that window.
                tpl=".github/production-workflows-examples/$f"
                dest_blob=$(git hash-object "$dest" 2>/dev/null || true)
                pristine=""
                if [ -n "$dest_blob" ]; then
                  for c in $(git rev-list "$GITHUB_SHA" -- "$tpl"); do
                    if [ "$(git rev-parse --verify --quiet "$c:$tpl" || true)" = "$dest_blob" ]; then
                      pristine="$c"
                      break
                    fi
                  done
                fi
                if [ -n "$pristine" ] && [ "$FREEZE_WORKFLOWS" != "true" ]; then
                  cp "$src" "$dest"
                  UPDATED="$UPDATED $f"
                  echo "::notice::$f: prod copy is a pristine template from ${pristine:0:8} — updated to current template"
                elif [ -n "$pristine" ]; then
                  DIFFERS="$DIFFERS $f"
                  echo "::notice::$f: pristine stale template, but freeze_workflows=true — NOT updating this run"
                else
                  DIFFERS="$DIFFERS $f"
                  echo "::notice::$f: prod repo has a customized copy — template differs, NOT overwriting (port changes manually if intended)"
                fi
              fi
            else
              cp "$src" "$dest"
              INSTALLED="$INSTALLED $f"
              echo "::notice::Installed $f"
            fi
          done

          git add .github/workflows/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: install/update production CI-CD from templates

          Installed:${INSTALLED:- (none)}
          Updated (pristine stale template):${UPDATED:- (none)}
          Already present (identical):${SKIPPED:- (none)}
          Customized on prod side (NOT overwritten):${DIFFERS:- (none)}

          Seeded from dev-repo .github/production-workflows-examples/ — this
          mirror is the only channel into this repository, so its CI/CD is
          versioned and delivered through it. Prod-side customizations are
          never overwritten.
          "
            echo "::notice::✅ Production CI/CD committed"
          else
            echo "::notice::Nothing to install — prod workflows already up to date"
          fi

          {
            echo "## Production CI/CD install"
            echo "- Installed:${INSTALLED:- (none)}"
            echo "- Updated (pristine stale template):${UPDATED:- (none)}"
            echo "- Already present:${SKIPPED:- (none)}"
            echo "- Customized (not overwritten):${DIFFERS:- (none)}"
          } >> $GITHUB_STEP_SUMMARY
          echo "installed=${INSTALLED}" >> $GITHUB_OUTPUT
          echo "updated=${UPDATED}" >> $GITHUB_OUTPUT
          echo "customized=${DIFFERS}" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Calculate next version
        id: version
        env:
          VERSION_BUMP: ${{ github.event.inputs.version_bump || 'patch' }}
        run: |
          echo "::group::Calculate next version"

          # Fetch tags from production repo
          git fetch prod-repo --tags 2>/dev/null || true

          # Get latest semantic version tag
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -1 || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "::notice::No previous version found, starting with v0.9.0"
            NEXT_VERSION="v0.9.0"
          else
            echo "::notice::Latest version: $LATEST_TAG"

            # Parse version (remove 'v' prefix)
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Increment based on bump type
            case "$VERSION_BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "::notice::Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV

          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # Publish the release version as a GHCR image tag.
      #
      # WHY THIS EXISTS: the production repo builds NO images. deploy-stack.yml
      # only PROMOTES what this repo's deploy-pipeline.yml already pushed, and
      # its `tag` input advertises `v1.2.3` as a valid value. But nothing ever
      # created such a tag: deploy-pipeline runs on `push: main` and tags the
      # image `main-<sha>` / `main` / `latest`, while the semantic version is
      # born HERE — and, after the PR merges, as a *git* tag in the prod repo.
      # A git tag is not an image tag, so `deploy-production.yml -f tag=v1.2.3`
      # died on the resolve-images gate ("image not found") and operators had
      # to fall back to the mutable `latest` — the exact thing that gate exists
      # to prevent.
      #
      # So the version tag is created here, on the image built for the very
      # commit being mirrored, BEFORE the PR is opened — the PR can then name a
      # tag that actually resolves. `imagetools create` copies the manifest
      # inside the registry: no pull, no rebuild, no re-tag of a fresh build,
      # so the released bits are bit-identical to what CI tested (and to what
      # `main-<sha>` points at).
      #
      # CAVEAT: a mirror whose PR is never merged still leaves its vX.Y.Z tag
      # behind. The next mirror computes the SAME next version (the prod git
      # tag was never created) and re-points that tag at the newer commit, so
      # vX.Y.Z is only immutable once its PR is merged. The immutable
      # `main-<sha>` source tag is recorded in the PR body for anyone who needs
      # to pin the exact artifact regardless.
      # ---------------------------------------------------------------------
      - name: Tag release images in GHCR
        id: tag-images
        env:
          # Set by the previous step via GITHUB_ENV; restated for `set -u`.
          NEXT_VERSION: ${{ env.NEXT_VERSION }}
          REGISTRY: ghcr.io
          IMAGE_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SKIP_IMAGE_TAGGING: ${{ inputs.skip_image_tagging }}
        run: |
          set -euo pipefail
          echo "::group::Tag release images in GHCR"

          # GHCR namespaces are lowercase; the owner login may not be.
          OWNER_LC=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          BACKEND="${REGISTRY}/${OWNER_LC}/scholarship-system-backend"
          FRONTEND="${REGISTRY}/${OWNER_LC}/scholarship-system-frontend"

          if [ "${SKIP_IMAGE_TAGGING}" = "true" ]; then
            echo "::warning::skip_image_tagging=true — no ${NEXT_VERSION} image will be published."
            echo "::warning::Production will have no version-tagged image to deploy for this release."
            cat > /tmp/release-deploy-section.md <<'SKIPPED_DEPLOY_EOF'
          ## 🚀 部署（合併後）

          ⚠️ **本次同步沒有產生版本映像**（dispatch 時勾選了 `skip_image_tagging`）。

          production repo **不會 build image**，它的 deploy workflows 只能部署開發 repo
          已推上 GHCR 的映像，因此本版本**沒有 `vX.Y.Z` 可用**。請先讓
          `deploy-pipeline.yml` 為此 commit 建置映像，再重新 dispatch 一次 mirror
          （不要勾 `skip_image_tagging`）取得版本映像；在那之前只能用
          `main-<sha>` 這種來源 tag 部署。

          SKIPPED_DEPLOY_EOF
            echo "RELEASE_IMAGE_TAG=" >> $GITHUB_ENV
            echo "RELEASE_IMAGE_SOURCE_TAG=" >> $GITHUB_ENV
            echo "RELEASE_IMAGE_NOTE=⚠️ 未標記（dispatch 時勾選 skip_image_tagging）— 本版本沒有 ${NEXT_VERSION} 映像可部署" >> $GITHUB_ENV
            echo "image_tag=" >> $GITHUB_OUTPUT
            echo "::endgroup::"
            exit 0
          fi

          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USER}" --password-stdin

          # Resolve the immutable tag deploy-pipeline.yml published for THIS
          # commit. It writes two commit-derived tags:
          #   type=sha,prefix={{branch}}-              → <ref>-<sha:0:7>
          #   type=raw,value=<ref>-$(git rev-parse --short HEAD)
          # The second uses git's auto-scaling abbreviation length, which grows
          # with the object count, so probe a range instead of assuming 7.
          SOURCE_TAG=""
          for len in 7 8 9 10 11 12; do
            candidate="${GITHUB_REF_NAME}-${GITHUB_SHA:0:$len}"
            if docker buildx imagetools inspect "${BACKEND}:${candidate}" >/dev/null 2>&1; then
              SOURCE_TAG="${candidate}"
              break
            fi
          done

          if [ -z "${SOURCE_TAG}" ]; then
            echo "::error::No upstream image found for commit ${GITHUB_SHA} (${GITHUB_REF_NAME})."
            echo "::error::Looked for ${BACKEND}:${GITHUB_REF_NAME}-<short sha>."
            echo "::error::deploy-pipeline.yml publishes it on every push to main —"
            echo "::error::wait for (or re-run) that workflow for this commit, then dispatch"
            echo "::error::this mirror again. To open the PR without a deployable image"
            echo "::error::anyway, dispatch with skip_image_tagging=true."
            exit 1
          fi

          echo "::notice::Source image tag for this commit: ${SOURCE_TAG}"

          # Both components must exist, and both must come from the same commit
          # — half a release is worse than none.
          if ! docker buildx imagetools inspect "${FRONTEND}:${SOURCE_TAG}" >/dev/null 2>&1; then
            echo "::error::${FRONTEND}:${SOURCE_TAG} is missing while the backend image exists."
            echo "::error::The build for this commit is incomplete — re-run deploy-pipeline.yml."
            exit 1
          fi

          for image in "${BACKEND}" "${FRONTEND}"; do
            if docker buildx imagetools inspect "${image}:${NEXT_VERSION}" >/dev/null 2>&1; then
              echo "::warning::${image}:${NEXT_VERSION} already exists — re-pointing it at ${SOURCE_TAG}."
              echo "::warning::(An earlier mirror computed the same version and its PR was never merged.)"
            fi
            echo "Tagging ${image}:${NEXT_VERSION} → ${SOURCE_TAG}"
            docker buildx imagetools create --tag "${image}:${NEXT_VERSION}" "${image}:${SOURCE_TAG}"
          done

          echo "::notice::✅ Published ${NEXT_VERSION} images (from ${SOURCE_TAG})"

          # Carried into the PR body / release notes by the next step.
          echo "RELEASE_IMAGE_TAG=${NEXT_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_IMAGE_SOURCE_TAG=${SOURCE_TAG}" >> $GITHUB_ENV
          echo "RELEASE_IMAGE_NOTE=\`${NEXT_VERSION}\`（由 \`${SOURCE_TAG}\` 複製 manifest，未重新 build）" >> $GITHUB_ENV
          echo "image_tag=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "source_tag=${SOURCE_TAG}" >> $GITHUB_OUTPUT

          # The deploy section of the production PR. Rendered here (quoted
          # heredoc + envsubst) rather than in the release-notes heredoc: the
          # text is full of backticks, which an unquoted heredoc would run as
          # command substitution.
          export IMAGE_TAG="${NEXT_VERSION}" SOURCE_IMAGE_TAG="${SOURCE_TAG}" IMAGE_NS="${OWNER_LC}"
          cat > /tmp/release-deploy-section.tpl <<'DEPLOY_EOF'
          ## 🚀 部署（合併後）

          **合併這個 PR 不會部署任何東西。** production repo 的 deploy workflows 只吃
          dispatch，而且**不 build image** — 它們部署的是開發 repo 已推上 GHCR 的映像。
          本次同步的 commit 已標上 `${IMAGE_TAG}`，兩個 stage 請帶**同一個 tag**：

          ```bash
          gh workflow run deploy-test.yml       -f tag=${IMAGE_TAG}
          gh workflow run deploy-production.yml -f tag=${IMAGE_TAG}
          # 只有本次同步動到 monitoring/** 時才需要：
          gh workflow run deploy-monitoring-test.yml
          gh workflow run deploy-monitoring-production.yml
          ```

          | 映像 | Tag |
          |---|---|
          | 版本（本次發布） | `ghcr.io/${IMAGE_NS}/scholarship-system-{backend,frontend}:${IMAGE_TAG}` |
          | 來源（不可變，內容相同） | `ghcr.io/${IMAGE_NS}/scholarship-system-{backend,frontend}:${SOURCE_IMAGE_TAG}` |

          版本 tag 是 mirror 時由來源映像**複製 manifest** 得來的，不是重新 build，
          因此與 CI 測過的成品逐位元相同。PR 合併前這個 tag 仍可能被下一次 mirror 重指
          （版本號要合併後才由 auto-tag 定案），要絕對釘死時請改用來源 tag。
          `tag` 留空會部署 `latest`，兩個 stage 可能因此落在不同映像上。

          DEPLOY_EOF
          envsubst < /tmp/release-deploy-section.tpl > /tmp/release-deploy-section.md

          {
            echo "## 📦 Release images"
            echo ""
            echo "| Image | Tag | Source (immutable) |"
            echo "|---|---|---|"
            echo "| \`scholarship-system-backend\` | \`${NEXT_VERSION}\` | \`${SOURCE_TAG}\` |"
            echo "| \`scholarship-system-frontend\` | \`${NEXT_VERSION}\` | \`${SOURCE_TAG}\` |"
          } >> $GITHUB_STEP_SUMMARY

          echo "::endgroup::"

      - name: Generate release notes
        id: release-notes
        run: |
          echo "::group::Generate release notes"

          # Pre-calculate sync date for use in heredoc
          SYNC_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # Create release notes file
          cat > /tmp/release-notes.md <<RELEASE_NOTES_EOF
          <!-- AUTO_TAG_METADATA
          Version: ${{ env.NEXT_VERSION }}
          -->

          # 🚀 Production Sync ${{ env.NEXT_VERSION }}

          ## 📋 Summary

          This release syncs the latest changes from the development repository to production.

          | Property | Value |
          |----------|-------|
          | **Version** | ${{ env.NEXT_VERSION }} |
          | **Deploy Image Tag** | ${RELEASE_IMAGE_NOTE} |
          | **Source Repo** | [${{ github.repository }}](https://github.com/${{ github.repository }}) |
          | **Source Commit** | [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Sync Date** | ${SYNC_DATE} |
          | **Triggered By** | @${{ github.actor }} |

          ## 🔄 Changes Synced from Production Repository

          ${{ env.PROD_SYNC_COMMITS }}

          ## ✨ Changes Merged from Main Branch

          ${{ env.MAIN_MERGE_COMMITS }}

          ## 📊 File Changes

          RELEASE_NOTES_EOF

          # Add file statistics placeholder (will be calculated after squashing)
          echo "" >> /tmp/release-notes.md
          echo "\`\`\`" >> /tmp/release-notes.md
          echo "PLACEHOLDER_FILE_STATS" >> /tmp/release-notes.md
          echo "\`\`\`" >> /tmp/release-notes.md

          # Add excluded/removed development files information
          cat >> /tmp/release-notes.md <<'REMOVED_FILES_EOF'

          ## 🚫 Excluded Development Files

          ### Workflows Removed
          ${{ env.REMOVED_WORKFLOWS }}

          ### Directories Removed
          ${{ env.REMOVED_DIRS }}

          ### Stale Files Removed (deleted in development)
          REMOVED_FILES_EOF

          # Append the reconciled stale-file list from disk rather than
          # interpolating it into the heredoc: file names must never be
          # shell-expanded (they could contain $ or backticks).
          if [ -s /tmp/stale-files.txt ]; then
            sed 's/^/- /' /tmp/stale-files.txt >> /tmp/release-notes.md
          else
            echo "- None" >> /tmp/release-notes.md
          fi

          cat >> /tmp/release-notes.md <<'REMOVED_FILES_EOF'

          ### Files Excluded from Sync (Not Deleted)
          - All test directories: `frontend/__tests__/`, `frontend/*/__tests__/`, `backend/app/tests/`
          - All test files: `*.test.tsx`, `*.test.ts`, `*.test.py`, `test_*.py`
          - Test configuration: `jest.config.js`, `pytest.ini`, `tsconfig.test.json`, `.coverage`
          - Docker compose variants: `docker-compose.*.yml` (except production files: `docker-compose.prod*.yml`)
          - Documentation files: `*.md` (README, CONTRIBUTING, etc.)

          ### Files Preserved for Production
          - Production Docker Compose: `docker-compose.prod.yml`, `docker-compose.prod-db.yml`, `docker-compose.prod-db-monitoring.yml`
          - Backup scripts: `scripts/backup.sh`
          - Production configurations and deployment files

          REMOVED_FILES_EOF

          # Deploy instructions for the exact images this release ships,
          # rendered by the "Tag release images in GHCR" step above.
          if [ -s /tmp/release-deploy-section.md ]; then
            cat /tmp/release-deploy-section.md >> /tmp/release-notes.md
          fi

          cat >> /tmp/release-notes.md <<'REMOVED_FILES_EOF'
          ## 📝 Notes

          - This is a production-ready snapshot with development files excluded or removed
          - Test files remain in development repository but are excluded from production sync
          - Release image tag: ${RELEASE_IMAGE_NOTE}
          - Production workflows preserved: ${{ steps.preserve-workflows.outputs.preserved_count || '0' }} workflow(s)
          - Workflows updated from templates (pristine stale copies):${{ steps.install-workflows.outputs.updated || ' (none)' }}
          - Workflows customized on prod side (NOT overwritten):${{ steps.install-workflows.outputs.customized || ' (none)' }}
          - All changes squashed into a single clean commit for production

          ___

          🤖 Generated by [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          REMOVED_FILES_EOF

          # Expand environment variables in release notes
          envsubst < /tmp/release-notes.md > /tmp/release-notes-final.md

          echo "::notice::Release notes generated"
          echo "::group::Release Notes Preview"
          cat /tmp/release-notes-final.md
          echo "::endgroup::"

          echo "::endgroup::"

      - name: Squash all changes into single commit
        id: squash-commit
        env:
          NEXT_VERSION: ${{ env.NEXT_VERSION }}
        run: |
          echo "::group::Squashing all changes into single commit"

          # Get current tree (all file states)
          CURRENT_TREE=$(git write-tree)
          echo "::notice::Current tree: $CURRENT_TREE"

          # Use prod-repo/main as the baseline to track production repo's actual state
          # This correctly handles squash merge where commit SHAs differ between repos
          # Fallback to origin/production for backward compatibility
          PROD_LATEST=$(git rev-parse prod-repo/main 2>/dev/null || \
                        git rev-parse origin/production 2>/dev/null || \
                        echo "")

          # Prepare commit message using generated release notes
          echo "Release $NEXT_VERSION" > /tmp/squash-commit-msg.txt
          echo "" >> /tmp/squash-commit-msg.txt
          cat /tmp/release-notes-final.md >> /tmp/squash-commit-msg.txt
          echo "" >> /tmp/squash-commit-msg.txt
          echo "___" >> /tmp/squash-commit-msg.txt
          echo "" >> /tmp/squash-commit-msg.txt
          echo "This commit squashes all development changes into a single release" >> /tmp/squash-commit-msg.txt
          echo "Full development history available in source repository" >> /tmp/squash-commit-msg.txt

          # Create new squashed commit
          if [ -n "$PROD_LATEST" ]; then
            # Based on production repo (maintaining continuity)
            NEW_COMMIT=$(git commit-tree $CURRENT_TREE -p $PROD_LATEST -F /tmp/squash-commit-msg.txt)
            echo "::notice::Created squashed commit based on prod-repo/main"
            echo "::notice::Parent commit: $PROD_LATEST"
          else
            # First sync - no parent
            NEW_COMMIT=$(git commit-tree $CURRENT_TREE -F /tmp/squash-commit-msg.txt)
            echo "::notice::Created initial squashed commit (no parent)"
          fi

          echo "::notice::New commit: $NEW_COMMIT"

          # Reset production branch to new commit
          git reset --hard $NEW_COMMIT

          echo "::notice::✅ All changes squashed into single commit"
          echo "::notice::Commit SHA: $NEW_COMMIT"
          echo "squashed_commit=$NEW_COMMIT" >> $GITHUB_OUTPUT

          # Show commit info
          echo "::group::Squashed Commit Details"
          git log -1 --stat
          echo "::endgroup::"

          echo "::endgroup::"

      - name: Calculate actual file changes
        run: |
          echo "::group::Calculate actual file statistics"

          # Use prod-repo/main as baseline (consistent with squash step)
          # Fallback to origin/production for backward compatibility
          PROD_LATEST=$(git rev-parse prod-repo/main 2>/dev/null || \
                        git rev-parse origin/production 2>/dev/null || \
                        echo "")

          if [ -n "$PROD_LATEST" ]; then
            # Calculate diff between production's latest and current HEAD (squashed commit)
            # Exclude development-only files
            FILE_STATS=$(git diff --stat $PROD_LATEST..HEAD -- \
              ':!.github/codeql' \
              ':!.github/workflows' \
              ':!.github/production-workflows-examples' \
              ':!.claude' \
              ':!mock-student-api' \
              ':!frontend/__tests__/**' \
              ':!frontend/components/__tests__/**' \
              ':!frontend/hooks/__tests__/**' \
              ':!frontend/lib/__tests__/**' \
              ':!frontend/lib/api/__tests__/**' \
              ':!frontend/lib/utils/__tests__/**' \
              ':!backend/app/tests/**' \
              ':!**/*.test.tsx' \
              ':!**/*.test.ts' \
              ':!**/*.test.py' \
              ':!**/test_*.py' \
              ':!frontend/jest.config.js' \
              ':!frontend/jest.config.standalone.js' \
              ':!frontend/tsconfig.test.json' \
              ':!backend/pytest.ini' \
              ':!backend/.coverage' \
              ':!docker-compose.dev.yml' \
              ':!docker-compose.staging.yml' \
              ':!docker-compose.staging-db.yml' \
              ':!docker-compose.staging-db-monitoring.yml' \
              ':!backend/docker-compose.yml' \
              ':!**/docker-compose.yml' \
              ':!**/*.md' \
              | tail -1)

            # Handle case where there are no changes
            if [ -z "$FILE_STATS" ] || [ "$FILE_STATS" = "" ]; then
              FILE_STATS="No file changes"
            fi

            echo "::notice::File statistics: $FILE_STATS"
          else
            # First sync - compare to empty tree
            FILE_STATS=$(git diff --stat $(git hash-object -t tree /dev/null)..HEAD -- \
              ':!.github/codeql' \
              ':!.github/workflows' \
              ':!.github/production-workflows-examples' \
              ':!.claude' \
              ':!mock-student-api' \
              ':!frontend/__tests__/**' \
              ':!frontend/components/__tests__/**' \
              ':!frontend/hooks/__tests__/**' \
              ':!frontend/lib/__tests__/**' \
              ':!frontend/lib/api/__tests__/**' \
              ':!frontend/lib/utils/__tests__/**' \
              ':!backend/app/tests/**' \
              ':!**/*.test.tsx' \
              ':!**/*.test.ts' \
              ':!**/*.test.py' \
              ':!**/test_*.py' \
              ':!frontend/jest.config.js' \
              ':!frontend/jest.config.standalone.js' \
              ':!frontend/tsconfig.test.json' \
              ':!backend/pytest.ini' \
              ':!backend/.coverage' \
              ':!docker-compose.dev.yml' \
              ':!docker-compose.staging.yml' \
              ':!docker-compose.staging-db.yml' \
              ':!docker-compose.staging-db-monitoring.yml' \
              ':!backend/docker-compose.yml' \
              ':!**/*.md' \
              | tail -1 || echo "Initial commit")
            echo "::notice::First sync - file statistics: $FILE_STATS"
          fi

          # Update release notes with actual file statistics
          # Use a different sed delimiter to avoid issues with special characters
          FILE_STATS_ESCAPED=$(echo "$FILE_STATS" | sed 's/[&/\]/\\&/g')
          sed -i "s|PLACEHOLDER_FILE_STATS|$FILE_STATS_ESCAPED|" /tmp/release-notes.md

          # Regenerate final release notes with environment variables expanded
          envsubst < /tmp/release-notes.md > /tmp/release-notes-final.md

          echo "::notice::✅ Release notes updated with actual file statistics"
          echo "::group::Updated Release Notes Preview"
          cat /tmp/release-notes-final.md
          echo "::endgroup::"

          echo "::endgroup::"

      - name: Push production branch to source repo
        run: |
          echo "::group::Push production branch"

          # Push production branch back to source repo
          # Note: Using --force because we squashed commits
          git push origin production --force

          echo "::notice::✅ Pushed squashed production branch to source repository"
          echo "::notice::View at: ${{ github.server_url }}/${{ github.repository }}/tree/production"
          echo "::notice::⚠️  Note: This is a force push due to commit squashing"

          echo "::endgroup::"

      - name: Push to production repository temp branch
        id: push-temp
        env:
          PRODUCTION_REPO: ${{ secrets.PRODUCTION_REPO }}
          PRODUCTION_BRANCH: ${{ secrets.PRODUCTION_BRANCH || 'main' }}
        run: |
          echo "::group::Push to production repository"

          # Generate temp branch name
          TEMP_BRANCH="production-sync-$(date -u '+%Y%m%d-%H%M%S')"
          echo "::notice::Creating temporary branch: $TEMP_BRANCH"
          echo "temp_branch=$TEMP_BRANCH" >> $GITHUB_OUTPUT

          # Push to production repo temp branch
          git push prod-repo production:"$TEMP_BRANCH"

          echo "::notice::✅ Pushed to production repository temp branch: $TEMP_BRANCH"

          echo "::endgroup::"

      - name: Create Pull Request in production repository
        id: create-pr
        env:
          PRODUCTION_REPO: ${{ secrets.PRODUCTION_REPO }}
          PRODUCTION_BRANCH: ${{ secrets.PRODUCTION_BRANCH || 'main' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "::group::Create Pull Request"

          # Determine PR title (standardized format for auto-tagging)
          if [ -n "${{ github.event.inputs.pr_title }}" ]; then
            PR_TITLE="${{ github.event.inputs.pr_title }}"
          else
            PR_TITLE="Release ${{ env.NEXT_VERSION }}"
          fi

          echo "::notice::Creating PR with title: $PR_TITLE"

          # Create PR in production repository
          PR_URL=$(gh pr create \
            --repo "${{ secrets.PRODUCTION_REPO }}" \
            --base "${{ secrets.PRODUCTION_BRANCH || 'main' }}" \
            --head "${{ steps.push-temp.outputs.temp_branch }}" \
            --title "$PR_TITLE" \
            --body-file /tmp/release-notes-final.md)

          echo "::notice::✅ Pull Request created: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

          # Also save to job summary
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🚀 Production Sync Complete

          ## Pull Request Created

          **PR URL**: $PR_URL

          **Version**: ${{ env.NEXT_VERSION }}

          **Deploy image tag**: \`${{ env.RELEASE_IMAGE_TAG || '(未標記 — skip_image_tagging)' }}\` (from \`${{ env.RELEASE_IMAGE_SOURCE_TAG || 'n/a' }}\`)

          **Temp Branch**: \`${{ steps.push-temp.outputs.temp_branch }}\`

          ## Next Steps

          1. Review the Pull Request in the production repository
          2. Merge the PR (using squash merge) when ready to deploy
          3. **The version tag will be created automatically** after PR merge (requires auto-tag workflow in production repo)
          4. **Merging deploys nothing.** The production repo's deploy workflows are
             dispatch-only — run them yourself, in this order, approving at each
             environment gate:
             \`\`\`bash
             gh workflow run deploy-test.yml       -f tag=${{ env.RELEASE_IMAGE_TAG || '<image tag>' }}
             gh workflow run deploy-production.yml -f tag=${{ env.RELEASE_IMAGE_TAG || '<same tag>' }}
             # only when monitoring/** changed in this sync:
             gh workflow run deploy-monitoring-test.yml
             gh workflow run deploy-monitoring-production.yml
             \`\`\`

          ## 🏷️ Auto-Tagging Information

          - **Tag Format**: \`${{ env.NEXT_VERSION }}\` (e.g., v1.2.3)
          - **Image Tag**: the same \`${{ env.NEXT_VERSION }}\` now exists on GHCR (\`scholarship-system-backend\` / \`-frontend\`), so the deploy dispatches above resolve
          - **PR Title Format**: \`Release ${{ env.NEXT_VERSION }}\`
          - **Metadata in PR Body**: Version information embedded for extraction
          - **Recommended**: Set up auto-tag workflow in production repository (see production-workflows-examples/)

          ## Quick Links

          - [Production Repository](${{ github.server_url }}/${{ secrets.PRODUCTION_REPO }})
          - [Pull Request]($PR_URL)
          - [Source Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          - [Production Branch](${{ github.server_url }}/${{ github.repository }}/tree/production)
          EOF

          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: |
          # Switch back to main branch
          git checkout main 2>/dev/null || true

          # Remove production repo remote
          git remote remove prod-repo 2>/dev/null || true

          echo "::notice::Cleanup completed"

  # ---------------------------------------------------------------------------
  # Consolidated security summary — written to THIS RUN's job summary only.
  #
  # The two reusable workflows each upload their own PDF/HTML/JSON artifact to
  # this run. This job adds a single overview (which scanner produced what, with
  # download hints) to the run page, so a reader doesn't have to open each job.
  #
  # It deliberately does NOT touch the production repo: no PR comment, no commit
  # into the sync payload. The production PR content is unchanged — the reports
  # live as artifacts on this workflow run.
  #
  # `always()` on purpose: a scan that failed or was skipped is stated
  # explicitly here rather than silently omitted (silence reads as "clean").
  # ---------------------------------------------------------------------------
  security-report-summary:
    name: Security report summary (run artifacts)
    runs-on: ubuntu-latest
    needs: [zap-report, codeql-report]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.security_reports
    permissions:
      contents: read

    steps:
      - name: Write run summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}

          ZAP_RESULT: ${{ needs.zap-report.result }}
          ZAP_HIGH: ${{ needs.zap-report.outputs.high }}
          ZAP_MEDIUM: ${{ needs.zap-report.outputs.medium }}
          ZAP_LOW: ${{ needs.zap-report.outputs.low }}
          ZAP_ARTIFACT: ${{ needs.zap-report.outputs.artifact }}

          CODEQL_RESULT: ${{ needs.codeql-report.result }}
          CODEQL_TOTAL: ${{ needs.codeql-report.outputs.total }}
          CODEQL_CRITICAL: ${{ needs.codeql-report.outputs.critical }}
          CODEQL_HIGH: ${{ needs.codeql-report.outputs.high }}
          CODEQL_MEDIUM: ${{ needs.codeql-report.outputs.medium }}
          CODEQL_ARTIFACT: ${{ needs.codeql-report.outputs.artifact }}
          CODEQL_SHA_MATCHED: ${{ needs.codeql-report.outputs.sha_matched }}
          CODEQL_RESOLVED_SHA: ${{ needs.codeql-report.outputs.resolved_sha }}
        run: |
          set -euo pipefail

          # One row per scanner. A non-success result becomes a visible row
          # rather than a missing one.
          row() {  # $1 name, $2 result, $3 detail
            case "$2" in
              success) echo "| $1 | ✅ 已產出 | $3 |" ;;
              skipped) echo "| $1 | ⏭️ 已略過 | 本次未執行 |" ;;
              *)       echo "| $1 | ❌ 未產出（\`$2\`）| 請查看對應 job 的 log |" ;;
            esac
          }

          {
            echo "## 🔐 本版本資安報告"
            echo ""
            echo "受測 commit：\`${COMMIT_SHA}\`"
            echo ""
            echo "報告以 **artifact** 形式附在本次 workflow run（保留 90 天），"
            echo "**不會**寫入 production repo 的 PR 內容。"
            echo ""
            echo "| 報告 | 狀態 | 結果 |"
            echo "|---|---|---|"
            row "OWASP ZAP (baseline)" "${ZAP_RESULT}" \
                "High **${ZAP_HIGH:-?}** / Medium **${ZAP_MEDIUM:-?}** / Low ${ZAP_LOW:-?}"
            row "CodeQL" "${CODEQL_RESULT}" \
                "Critical **${CODEQL_CRITICAL:-?}** / High **${CODEQL_HIGH:-?}** / Medium ${CODEQL_MEDIUM:-?}（共 ${CODEQL_TOTAL:-?}）"
            echo ""
            echo "📥 **下載**（本次 run 頁面下方 Artifacts 區）：[${RUN_URL}](${RUN_URL})"
            if [ "${ZAP_RESULT}" = "success" ]; then
              echo "- \`${ZAP_ARTIFACT}\` — ZAP：PDF / HTML / JSON / MD"
            fi
            if [ "${CODEQL_RESULT}" = "success" ]; then
              echo "- \`${CODEQL_ARTIFACT}\` — CodeQL：PDF"
            fi
            echo ""

            if [ "${CODEQL_RESULT}" = "success" ] && [ "${CODEQL_SHA_MATCHED}" != "true" ]; then
              echo "> ⚠️ **CodeQL 報告並非本 commit**：找不到 \`${COMMIT_SHA}\` 的成功 CodeQL run，"
              echo "> 報告內容對應的是 \`${CODEQL_RESOLVED_SHA}\`。請勿直接當作本版本的佐證。"
              echo ""
            fi

            echo "### 判讀須知"
            echo ""
            echo "ZAP 為 **baseline（被動）** 掃描：**不送攻擊 payload、未認證**，"
            echo "因此不涵蓋 SQLi／XSS／指令注入，也未涵蓋登入後的功能。"
            echo "**「0 findings」代表「被動掃描未發現」，不等於「已完整測試且安全」。**"
            echo "完整限制說明在 PDF 內；認證後的主動掃描見 \`security/zap/\`。"
          } >> "$GITHUB_STEP_SUMMARY"
