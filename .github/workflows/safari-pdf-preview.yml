# Real-Safari check for framed-PDF rendering (issue #1434).
#
# Self-contained: no dev stack and no secrets, unlike safari-upload-preview.yml.
#   matrix — serves a page + PDF from the runner under several header sets and
#            measures what real Safari (safaridriver) paints. Pins the cause: a
#            blob: PDF frame is blank exactly when the page has
#            `frame-ancestors 'none'`. Gates on the same-origin URL frame, which
#            is what the remote previews rely on.
#   dialog — the real FilePreviewDialog from the production Next build (real
#            middleware headers), local + remote PDF, first open and re-open.
#
# macOS minutes cost 10x, so this runs on branch pushes that touch the preview
# path (never on main), or by hand.
name: Safari PDF preview

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - scripts/safari/**
      - frontend/components/file-preview-dialog.tsx
      - frontend/components/inline-pdf-viewer.tsx
      - frontend/components/file-upload.tsx
      - frontend/lib/file-preview.ts
      - frontend/lib/security-headers.ts
      - frontend/middleware.ts
      - frontend/app/api/v1/preview/**
      - .github/workflows/safari-pdf-preview.yml

permissions:
  contents: read

concurrency:
  group: safari-pdf-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      OUT_DIR: safari-matrix
      BROWSER: safari
    steps:
      - uses: actions/checkout@v4

      - name: Enable safaridriver
        run: |
          sudo safaridriver --enable
          safaridriver --version
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: pip install "selenium>=4.20" pillow

      - name: Run the header / embed matrix in Safari
        run: |
          set -o pipefail
          python scripts/safari/pdf_header_matrix.py 2>&1 | tee matrix.log

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            sed -n '/^headers /,$p' matrix.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-pdf-matrix
          path: safari-matrix/
          retention-days: 7

  dialog:
    # The real FilePreviewDialog (Radix Dialog + iframe + skeleton) from the
    # production Next build, in real Safari — what the header matrix cannot see.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OUT_DIR: safari-dialog
      BROWSER: safari
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: pip install "selenium>=4.20" pillow

      - name: Add the CI-only harness page and sample PDF
        run: |
          mkdir -p frontend/app/safari-harness
          cp scripts/safari/harness/page.tsx frontend/app/safari-harness/page.tsx
          mkdir -p frontend/app/api/v1/preview/sample
          cp scripts/safari/harness/preview-sample-route.ts frontend/app/api/v1/preview/sample/route.ts
          python scripts/safari/pdf_header_matrix.py --write-pdf frontend/public/sample.pdf
          # The harness is served over plain http://localhost, where Safari
          # applies `upgrade-insecure-requests` to same-origin chunks and the
          # page never hydrates. Real staging/prod are https, so drop ONLY that
          # directive here; every other header stays the real middleware's.
          sed -i '' '/"upgrade-insecure-requests",/d' frontend/middleware.ts
          if grep -q '"upgrade-insecure-requests"' frontend/middleware.ts; then
            echo "::error::could not strip upgrade-insecure-requests from middleware.ts; the harness page would never hydrate over http"
            exit 1
          fi

      - name: Build and start the production frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
          nohup bun run start > ../next.log 2>&1 &
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/safari-harness || true)
            echo "harness attempt $attempt: $code"
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ]
          curl -sI http://localhost:3000/safari-harness | grep -i -E 'cross-origin|content-security|x-frame'

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Drive the dialog in Safari
        env:
          EXPECT_PAINTED: "1"
        run: |
          set -o pipefail
          python scripts/safari/dialog_pdf_preview.py 2>&1 | tee dialog.log

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            sed -n '/^case /,$p' dialog.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-dialog
          path: |
            safari-dialog/
            next.log
          retention-days: 7
