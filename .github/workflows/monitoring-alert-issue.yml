# Production copy of .github/workflows/monitoring-alert-issue.yml — installed
# into the production repository by mirror-to-production.yml.
#
# deploy-monitoring-stack.yml points the webhook-bridge at THIS repository
# (GH_REPO defaults to github.repository), so a repository_dispatch
# `monitoring-alert` lands here. Without this handler every dispatch was
# accepted by GitHub and then silently dropped — alerts reached no one.
name: Create Monitoring Alert Issue

on:
  repository_dispatch:
    types: [monitoring-alert]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  issues: write
  contents: read

jobs:
  handle-alert:
    runs-on: ubuntu-latest
    steps:
      # Every later step reads the NORMALISED values from this step's outputs,
      # never the raw payload. Grafana's own alerts (DatasourceError,
      # DatasourceNoData) carry none of our labels, so `environment` arrives
      # empty; the label step used to default it to `env:unknown` while the
      # find/create steps used the raw `env:` — a label that never exists —
      # so `gh issue create` failed with "could not add label: 'env:' not
      # found" on every repeat.
      - name: Normalise payload, render issue title and body
        id: render
        env:
          ALERT: ${{ github.event.client_payload.alertname }}
          ENV: ${{ github.event.client_payload.environment }}
          STATUS: ${{ github.event.client_payload.status }}
          SEVERITY: ${{ github.event.client_payload.severity }}
          SUMMARY: ${{ github.event.client_payload.summary }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          INSTANCE: ${{ github.event.client_payload.instance }}
          VALUE: ${{ github.event.client_payload.value }}
          FIRED_AT: ${{ github.event.client_payload.fired_at }}
          GRAFANA_URL: ${{ github.event.client_payload.grafana_url }}
        run: |
          # Label-safe: gh splits --label on commas, and GitHub caps a label
          # at 50 characters.
          label_part() { printf '%s' "$1" | tr -d ',\n\r' | cut -c1-40; }

          ALERT=$(label_part "${ALERT:-unknown}")
          ENV=$(label_part "${ENV:-unknown}")
          SEVERITY=$(label_part "${SEVERITY:-warning}")
          STATUS="${STATUS:-firing}"
          SUMMARY="${SUMMARY:-(no summary)}"
          DESCRIPTION="${DESCRIPTION:-(no description)}"
          INSTANCE="${INSTANCE:-(unknown)}"
          VALUE="${VALUE:-(no value)}"
          FIRED_AT="${FIRED_AT:-$(date -u -Iseconds)}"
          GRAFANA_URL="${GRAFANA_URL:-(unknown)}"

          {
            echo "alert=$ALERT"
            echo "env=$ENV"
            echo "severity=$SEVERITY"
            echo "status=$STATUS"
            echo "fired_at=$FIRED_AT"
            printf 'title=%s\n' "$(printf 'Monitoring Alert: %s (%s/%s)' "$ALERT" "$ENV" "$SEVERITY" | tr -d '\n\r')"
          } >> "$GITHUB_OUTPUT"

          cat > /tmp/body.md <<EOF
          ## $STATUS — $ALERT

          **Environment:** \`$ENV\`
          **Severity:** \`$SEVERITY\`
          **Instance:** \`$INSTANCE\`
          **Value:** $VALUE
          **Fired at:** $FIRED_AT
          **Grafana:** $GRAFANA_URL

          ### Summary
          $SUMMARY

          ### Description
          $DESCRIPTION
          EOF

      - name: Find existing issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ALERT: ${{ steps.render.outputs.alert }}
          ENV: ${{ steps.render.outputs.env }}
        run: |
          ISSUE=$(gh issue list \
            --repo "$REPO" \
            --label "monitoring-alert" \
            --label "alert:$ALERT" \
            --label "env:$ENV" \
            --state all \
            --limit 1 \
            --json number,state \
            --jq '.[0]')
          if [ -n "$ISSUE" ] && [ "$ISSUE" != "null" ]; then
            {
              echo "found=true"
              echo "number=$(echo "$ISSUE" | jq -r .number)"
              echo "state=$(echo "$ISSUE" | jq -r .state)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure dynamic labels exist
        # gh issue create --label fails hard if the label doesn't already
        # exist on the repo. The alert/env/severity values come from
        # arbitrary Grafana payloads, so pre-create them on demand.
        # `gh label create` returns non-zero if the label already exists,
        # hence the `|| true` swallow.
        if: steps.render.outputs.status == 'firing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ALERT: ${{ steps.render.outputs.alert }}
          ENV: ${{ steps.render.outputs.env }}
          SEVERITY: ${{ steps.render.outputs.severity }}
        run: |
          for label in "monitoring-alert" "alert:$ALERT" "env:$ENV" "severity:$SEVERITY"; do
            gh label create "$label" \
              --repo "$REPO" \
              --color "ededed" \
              --description "Auto-created by monitoring-alert workflow" \
              2>/dev/null || true
          done

      - name: Create new issue (no existing match, status=firing)
        if: steps.find.outputs.found != 'true' && steps.render.outputs.status == 'firing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: ${{ steps.render.outputs.title }}
          ALERT: ${{ steps.render.outputs.alert }}
          ENV: ${{ steps.render.outputs.env }}
          SEVERITY: ${{ steps.render.outputs.severity }}
        run: |
          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body-file /tmp/body.md \
            --label "monitoring-alert" \
            --label "alert:$ALERT" \
            --label "env:$ENV" \
            --label "severity:$SEVERITY"

      - name: Reopen + comment (existing closed, status=firing)
        if: steps.find.outputs.found == 'true' && steps.find.outputs.state == 'CLOSED' && steps.render.outputs.status == 'firing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          gh issue reopen "$NUMBER" --repo "$REPO"
          gh issue comment "$NUMBER" --repo "$REPO" --body-file /tmp/body.md

      - name: Append firing comment (existing open, status=firing)
        if: steps.find.outputs.found == 'true' && steps.find.outputs.state == 'OPEN' && steps.render.outputs.status == 'firing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body-file /tmp/body.md

      - name: Append resolved comment (existing issue, status=resolved)
        if: steps.find.outputs.found == 'true' && steps.render.outputs.status == 'resolved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.find.outputs.number }}
          FIRED_AT: ${{ steps.render.outputs.fired_at }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" \
            --body "✅ Alert resolved at $(date -u -Iseconds). Original fired_at: ${FIRED_AT}. Closing left to operator after verifying root cause."
