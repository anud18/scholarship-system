# TEMPORARY — staging AP VM disk rescue. Delete this file and its branch once
# staging is healthy again.
#
# Staging hit the same failure as production (issue #1423): once the disk
# fills, Prometheus can tear a WAL record, every compaction afterwards fails,
# and the WAL grows until the disk is full again.
#
# EMERGENCY VERSION. The earlier revisions called the docker CLI first and every
# call hung (one step sat for an hour), so the critical path here does not need
# dockerd at all:
#   - every command is wrapped in `timeout`
#   - sizes are read and the WAL is removed straight from
#     /var/lib/docker/volumes/*prometheus_data/_data with passwordless sudo
#     (staging's deploy workflows already rely on it)
#   - Prometheus is then restarted through docker if dockerd answers, else its
#     process is sent SIGTERM and the restart policy brings it back
# Persisted blocks are kept, so < ~2h of metrics are lost. Nothing else is
# removed except the systemd journal beyond 200 MB and docker build cache /
# dangling images (only if dockerd answers).
#
# USAGE: every push to this branch runs it.

name: Diagnose / rescue staging disk

on:
  push:
    branches:
      - 'diag/staging-disk-rescue'

concurrency:
  group: diag-staging-disk-rescue
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLEANUP_THRESHOLD_PCT: 85
  T: "timeout 120"

jobs:
  rescue:
    name: Staging disk rescue
    runs-on: [self-hosted, scholarship, test]
    timeout-minutes: 90
    steps:
      - name: Host state (before)
        run: |
          set +e
          echo "host: $(hostname)  $(date -u)"; cat /proc/loadavg
          $T df -hT -x tmpfs -x overlay -x squashfs
          $T free -h
          $T sudo -n du -sh /var/lib/docker/volumes/*/_data 2>/dev/null | sort -rh | head -10

      - name: Find Prometheus WAL
        id: prom
        run: |
          set +e
          DATA=$(sudo -n sh -c 'ls -d /var/lib/docker/volumes/*prometheus_data/_data' 2>/dev/null | head -1)
          echo "data=${DATA}" >> "$GITHUB_OUTPUT"
          [ -n "$DATA" ] || { echo "::warning::no *prometheus_data volume found"; exit 0; }
          echo "prometheus data: ${DATA}"
          WAL_MB=$($T sudo -n du -sm "${DATA}/wal" 2>/dev/null | cut -f1)
          echo "wal_mb=${WAL_MB:-0}" >> "$GITHUB_OUTPUT"
          echo "wal: ${WAL_MB:-?} MB, segments: $(sudo -n ls "${DATA}/wal" 2>/dev/null | grep -c '^[0-9]')"
          sudo -n sh -c "ls -d ${DATA}/wal/checkpoint.*" 2>/dev/null

      - name: Decide
        id: decide
        run: |
          USED=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          WAL_MB="${{ steps.prom.outputs.wal_mb }}"
          echo "root used: ${USED}%  wal: ${WAL_MB:-0} MB"
          # A healthy WAL is a few hundred MB; > 2 GB means truncation stopped.
          if [ "${USED}" -ge "${CLEANUP_THRESHOLD_PCT}" ] || [ "${WAL_MB:-0}" -gt 2048 ]; then
            echo "cleanup=true" >> "$GITHUB_OUTPUT"
          else
            echo "cleanup=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Disk below threshold and WAL small — report only."
          fi

      - name: Reset Prometheus WAL (no dockerd needed)
        if: steps.decide.outputs.cleanup == 'true' && steps.prom.outputs.data != ''
        env:
          DATA: ${{ steps.prom.outputs.data }}
        run: |
          set +e
          # Stop first when dockerd answers, so nothing is writing while we delete.
          $T docker stop -t 30 monitoring_prometheus && STOPPED=1
          $T sudo -n rm -rf "${DATA}/wal" "${DATA}/chunks_head"
          echo "removed wal/ and chunks_head/ (rc=$?)"
          if [ -n "${STOPPED}" ]; then
            $T docker start monitoring_prometheus && echo "✅ prometheus started"
          else
            # dockerd did not answer: deleted-but-open files only free their
            # space once closed, so end the process; the restart policy
            # (unless-stopped) brings it back with a fresh WAL.
            PID=$(pgrep -f 'prometheus.*--storage.tsdb.path' | head -1)
            [ -n "$PID" ] && sudo -n kill -TERM "$PID" && echo "sent SIGTERM to prometheus pid $PID"
          fi
          $T df -h /

      - name: Trim journal, docker cache
        if: always() && steps.decide.outputs.cleanup == 'true'
        run: |
          set +e
          $T sudo -n journalctl --vacuum-size=200M
          $T docker image prune -f
          $T docker builder prune -af

      - name: Host state (after)
        if: always()
        run: |
          set +e
          cat /proc/loadavg
          $T df -h /
          $T free -h
          echo "== top processes by CPU"; $T ps -eo pid,user,%cpu,%mem,rss,etime,comm --sort=-%cpu | head -12
          echo "== top processes by memory"; $T ps -eo pid,user,%cpu,%mem,rss,etime,comm --sort=-%mem | head -12

      - name: Container CPU / memory
        if: always()
        run: |
          set +e
          $T docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'
