name: "Generate CodeQL PDF Report"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID that produced SARIF artifacts (leave empty for latest)"
        required: false
        type: string
      sha:
        description: "Commit SHA to report on (resolves the CodeQL run for exactly that commit; overrides 'latest')"
        required: false
        type: string
      label:
        description: "Label shown in the report header and appended to artifact names (e.g. v1.2.3)"
        required: false
        type: string

  # Callable from other workflows (mirror-to-production.yml uses this to
  # produce a per-release report) so the ~300-line SARIF parser below lives
  # in exactly one place.
  workflow_call:
    inputs:
      run_id:
        required: false
        type: string
      sha:
        required: false
        type: string
      label:
        required: false
        type: string
    outputs:
      total:
        description: "Total number of CodeQL findings"
        value: ${{ jobs.generate-pdf.outputs.total }}
      critical:
        description: "Critical-severity findings"
        value: ${{ jobs.generate-pdf.outputs.critical }}
      high:
        description: "High-severity findings"
        value: ${{ jobs.generate-pdf.outputs.high }}
      medium:
        description: "Medium-severity findings"
        value: ${{ jobs.generate-pdf.outputs.medium }}
      artifact:
        description: "Name of the uploaded PDF artifact"
        value: ${{ jobs.generate-pdf.outputs.artifact }}
      resolved_sha:
        description: "Commit SHA the reported CodeQL run actually analysed"
        value: ${{ jobs.generate-pdf.outputs.resolved_sha }}
      sha_matched:
        description: "'true' when the CodeQL run analysed the requested SHA exactly"
        value: ${{ jobs.generate-pdf.outputs.sha_matched }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-pdf:
    name: Generate PDF from SARIF
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      total: ${{ steps.counts.outputs.total }}
      critical: ${{ steps.counts.outputs.critical }}
      high: ${{ steps.counts.outputs.high }}
      medium: ${{ steps.counts.outputs.medium }}
      artifact: ${{ steps.names.outputs.pdf_artifact }}
      resolved_sha: ${{ steps.set-run-id.outputs.resolved_sha }}
      sha_matched: ${{ steps.set-run-id.outputs.sha_matched }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve CodeQL run ID
        id: set-run-id
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          # Explicit run id always wins.
          if [ -n "${INPUT_RUN_ID}" ]; then
            RUN_ID="${INPUT_RUN_ID}"
            RESOLVED_SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha' 2>/dev/null || echo "")
            MATCHED="true"
          elif [ -n "${INPUT_SHA}" ]; then
            # Report on a SPECIFIC commit. Anything else would silently attach
            # a report for different code to a release, which is worse than
            # having no report at all — so a mismatch is surfaced loudly and
            # exported for the caller to show.
            RUN_ID=$(gh run list --workflow=codeql.yml --status=success --limit=50 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha==\"${INPUT_SHA}\")] | .[0].databaseId // empty")
            if [ -n "$RUN_ID" ]; then
              RESOLVED_SHA="${INPUT_SHA}"
              MATCHED="true"
            else
              echo "::warning::No successful CodeQL run found for ${INPUT_SHA}; falling back to the most recent successful run. The report will NOT describe the requested commit."
              RUN_ID=$(gh run list --workflow=codeql.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
              RESOLVED_SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha' 2>/dev/null || echo "")
              MATCHED="false"
            fi
          else
            RUN_ID=$(gh run list --workflow=codeql.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
            RESOLVED_SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha' 2>/dev/null || echo "")
            MATCHED="true"
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not resolve a successful CodeQL run to report on."
            exit 1
          fi

          echo "::notice::Using CodeQL run $RUN_ID (sha ${RESOLVED_SHA:-unknown})"
          {
            echo "run_id=$RUN_ID"
            echo "resolved_sha=$RESOLVED_SHA"
            echo "sha_matched=$MATCHED"
          } >> "$GITHUB_OUTPUT"

      - name: Compute report labels
        id: names
        env:
          INPUT_LABEL: ${{ inputs.label }}
          RESOLVED_SHA: ${{ steps.set-run-id.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${RESOLVED_SHA}" | cut -c1-8)
          if [ -n "${INPUT_LABEL}" ]; then
            LABEL="${INPUT_LABEL}"
            SUFFIX="-${INPUT_LABEL}"
          elif [ -n "$SHORT_SHA" ]; then
            LABEL="$SHORT_SHA"
            SUFFIX="-$SHORT_SHA"
          else
            LABEL=""
            SUFFIX=""
          fi
          {
            echo "label=$LABEL"
            echo "pdf_artifact=codeql-security-report${SUFFIX}"
            echo "html_artifact=codeql-security-report-html${SUFFIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Download SARIF artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          run_id: ${{ steps.set-run-id.outputs.run_id }}
          name: codeql-sarif-.*
          name_is_regexp: true
          path: sarif-artifacts
          skip_unpack: false
          if_no_artifact_found: warn

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jinja2 weasyprint

      - name: Parse SARIF and generate report
        shell: python
        run: |
          import json
          import pathlib
          from datetime import datetime
          from collections import defaultdict
          from jinja2 import Template

          # Map CodeQL language identifiers to friendly display names
          LANGUAGE_MAP = {
              'actions': 'GitHub Actions',
              'javascript-typescript': 'JavaScript/TypeScript',
              'javascript': 'JavaScript/TypeScript',  # SARIF file uses 'javascript'
              'python': 'Python'
          }

          # Find all SARIF files
          sarif_dir = pathlib.Path("sarif-artifacts")
          sarif_files = list(sarif_dir.rglob("*.sarif"))

          if not sarif_files:
              print("No SARIF files found!")
              exit(1)

          print(f"Found {len(sarif_files)} SARIF file(s)")

          # Parse all SARIF files
          all_results = []
          severity_counts = defaultdict(lambda: defaultdict(int))
          languages = set()

          for sarif_file in sarif_files:
              print(f"Processing: {sarif_file}")
              sarif_data = json.loads(sarif_file.read_text(encoding="utf-8"))

              for run in sarif_data.get("runs", []):
                  tool_name = run.get("tool", {}).get("driver", {}).get("name", "Unknown")

                  # Extract language from artifact directory or SARIF filename
                  artifact_dir = sarif_file.parent.name.replace("codeql-sarif-", "")
                  sarif_name = sarif_file.stem  # e.g., 'javascript' from 'javascript.sarif'

                  # Try artifact directory name first, fall back to SARIF filename
                  language_key = artifact_dir if artifact_dir in LANGUAGE_MAP else sarif_name
                  language = LANGUAGE_MAP.get(language_key, language_key)

                  print(f"  Artifact: {artifact_dir}, SARIF: {sarif_name}, Display: {language}")
                  languages.add(language)

                  # Build rules lookup
                  rules = {}
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                      rules[rule["id"]] = rule

                  # Process results
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "unknown")
                      rule = rules.get(rule_id, {})

                      # Determine severity
                      level = result.get("level", "warning")
                      severity_map = {
                          "error": "High",
                          "warning": "Medium",
                          "note": "Low",
                          "none": "Info"
                      }
                      severity = severity_map.get(level, "Medium")

                      # Get security severity if available
                      security_severity = rule.get("properties", {}).get("security-severity")
                      if security_severity:
                          score = float(security_severity)
                          if score >= 9.0:
                              severity = "Critical"
                          elif score >= 7.0:
                              severity = "High"
                          elif score >= 4.0:
                              severity = "Medium"
                          else:
                              severity = "Low"

                      # Get location info
                      locations = result.get("locations", [{}])
                      if locations:
                          physical_loc = locations[0].get("physicalLocation", {})
                          artifact = physical_loc.get("artifactLocation", {})
                          region = physical_loc.get("region", {})

                          file_path = artifact.get("uri", "Unknown")
                          start_line = region.get("startLine", 0)
                          end_line = region.get("endLine", start_line)
                      else:
                          file_path = "Unknown"
                          start_line = 0
                          end_line = 0

                      # Get message
                      message = result.get("message", {}).get("text", "No description")

                      # Get rule description
                      rule_desc = rule.get("shortDescription", {}).get("text", "") or \
                                  rule.get("fullDescription", {}).get("text", "")

                      all_results.append({
                          "language": language,
                          "tool": tool_name,
                          "rule_id": rule_id,
                          "rule_description": rule_desc,
                          "severity": severity,
                          "file": file_path,
                          "start_line": start_line,
                          "end_line": end_line,
                          "message": message
                      })

                      severity_counts[language][severity] += 1

          # Sort results by severity then language
          severity_order = {"Critical": 0, "High": 1, "Medium": 2, "Low": 3, "Info": 4}
          all_results.sort(key=lambda x: (severity_order.get(x["severity"], 99), x["language"], x["file"]))

          # Generate HTML report
          html_template = Template('''
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>CodeQL Security Audit Report</title>
              <style>
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      margin: 40px;
                      line-height: 1.6;
                      color: #333;
                  }
                  h1 {
                      color: #2c3e50;
                      border-bottom: 3px solid #3498db;
                      padding-bottom: 10px;
                  }
                  h2 {
                      color: #34495e;
                      margin-top: 30px;
                      border-left: 4px solid #3498db;
                      padding-left: 10px;
                  }
                  h3 {
                      color: #7f8c8d;
                      margin-top: 20px;
                  }
                  .meta-info {
                      background: #ecf0f1;
                      padding: 15px;
                      border-radius: 5px;
                      margin: 20px 0;
                  }
                  .summary-table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 20px 0;
                  }
                  .summary-table th, .summary-table td {
                      border: 1px solid #bdc3c7;
                      padding: 10px;
                      text-align: left;
                  }
                  .summary-table th {
                      background: #34495e;
                      color: white;
                  }
                  .summary-table tr:nth-child(even) {
                      background: #f8f9fa;
                  }
                  .finding {
                      margin: 20px 0;
                      padding: 15px;
                      border-left: 4px solid #95a5a6;
                      background: #f8f9fa;
                      page-break-inside: avoid;
                  }
                  .finding.critical {
                      border-left-color: #8b0000;
                      background: #ffe6e6;
                  }
                  .finding.high {
                      border-left-color: #e74c3c;
                      background: #ffebe6;
                  }
                  .finding.medium {
                      border-left-color: #f39c12;
                      background: #fff8e6;
                  }
                  .finding.low {
                      border-left-color: #3498db;
                      background: #e6f2ff;
                  }
                  .severity {
                      display: inline-block;
                      padding: 4px 8px;
                      border-radius: 3px;
                      font-weight: bold;
                      font-size: 0.9em;
                  }
                  .severity.critical { background: #8b0000; color: white; }
                  .severity.high { background: #e74c3c; color: white; }
                  .severity.medium { background: #f39c12; color: white; }
                  .severity.low { background: #3498db; color: white; }
                  .severity.info { background: #95a5a6; color: white; }
                  .location {
                      font-family: 'Courier New', monospace;
                      background: #ecf0f1;
                      padding: 5px;
                      border-radius: 3px;
                      font-size: 0.9em;
                  }
                  code {
                      background: #ecf0f1;
                      padding: 2px 5px;
                      border-radius: 3px;
                      font-family: 'Courier New', monospace;
                  }
              </style>
          </head>
          <body>
              <h1>CodeQL Security Audit Report</h1>

              <div class="meta-info">
                  <p><strong>Generated:</strong> {{ timestamp }}</p>
                  <p><strong>Repository:</strong> {{ repo }}</p>
                  {% if label %}<p><strong>Version:</strong> {{ label }}</p>{% endif %}
                  {% if commit %}<p><strong>Commit analysed:</strong> <code>{{ commit }}</code></p>{% endif %}
                  <p><strong>Languages Analyzed:</strong> {{ languages|join(', ') }}</p>
                  <p><strong>Total Findings:</strong> {{ total_findings }}</p>
              </div>

              <h2>Executive Summary</h2>
              <table class="summary-table">
                  <thead>
                      <tr>
                          <th>Language</th>
                          <th>Critical</th>
                          <th>High</th>
                          <th>Medium</th>
                          <th>Low</th>
                          <th>Info</th>
                          <th>Total</th>
                      </tr>
                  </thead>
                  <tbody>
                      {% for lang in languages %}
                      <tr>
                          <td><strong>{{ lang }}</strong></td>
                          <td>{{ severity_counts[lang]['Critical'] or 0 }}</td>
                          <td>{{ severity_counts[lang]['High'] or 0 }}</td>
                          <td>{{ severity_counts[lang]['Medium'] or 0 }}</td>
                          <td>{{ severity_counts[lang]['Low'] or 0 }}</td>
                          <td>{{ severity_counts[lang]['Info'] or 0 }}</td>
                          <td><strong>{{ lang_totals[lang] }}</strong></td>
                      </tr>
                      {% endfor %}
                  </tbody>
              </table>

              {% for lang in languages %}
              <h2>{{ lang }} Analysis Results</h2>
              {% set lang_findings = results|selectattr("language", "equalto", lang)|list %}
              {% if lang_findings %}
                  {% for finding in lang_findings %}
                  <div class="finding {{ finding.severity|lower }}">
                      <h3>
                          <span class="severity {{ finding.severity|lower }}">{{ finding.severity }}</span>
                          {{ finding.rule_id }}
                      </h3>
                      {% if finding.rule_description %}
                      <p><strong>Description:</strong> {{ finding.rule_description }}</p>
                      {% endif %}
                      <p><strong>Message:</strong> {{ finding.message }}</p>
                      <p><strong>Location:</strong>
                          <span class="location">
                              {{ finding.file }}
                              {% if finding.start_line > 0 %}
                                  {% if finding.end_line > finding.start_line %}
                                      (lines {{ finding.start_line }}-{{ finding.end_line }})
                                  {% else %}
                                      (line {{ finding.start_line }})
                                  {% endif %}
                              {% endif %}
                          </span>
                      </p>
                  </div>
                  {% endfor %}
              {% else %}
                  <p>No findings for this language.</p>
              {% endif %}
              {% endfor %}

              <div style="margin-top: 50px; padding-top: 20px; border-top: 1px solid #bdc3c7; text-align: center; color: #7f8c8d;">
                  <p>Generated by CodeQL Security Analysis</p>
              </div>
          </body>
          </html>
          ''')

          # Calculate totals
          lang_totals = {lang: sum(counts.values()) for lang, counts in severity_counts.items()}

          # Render HTML
          html_content = html_template.render(
              timestamp=datetime.now().strftime("%Y-%m-%d %H:%M:%S UTC"),
              repo="${{ github.repository }}",
              label="${{ steps.names.outputs.label }}",
              commit="${{ steps.set-run-id.outputs.resolved_sha }}",
              languages=sorted(languages),
              total_findings=len(all_results),
              severity_counts=severity_counts,
              lang_totals=lang_totals,
              results=all_results
          )

          # Write HTML file
          pathlib.Path("codeql-report.html").write_text(html_content, encoding="utf-8")
          print(f"Generated HTML report with {len(all_results)} findings")

          # Totals for the workflow outputs, so callers can summarise without
          # re-parsing the SARIF.
          totals = defaultdict(int)
          for r in all_results:
              totals[r["severity"]] += 1
          pathlib.Path("codeql-counts.json").write_text(json.dumps({
              "total": len(all_results),
              "critical": totals["Critical"],
              "high": totals["High"],
              "medium": totals["Medium"],
              "low": totals["Low"],
              "info": totals["Info"],
          }), encoding="utf-8")

      - name: Convert HTML to PDF
        shell: python
        run: |
          from weasyprint import HTML, CSS
          from weasyprint.text.fonts import FontConfiguration

          font_config = FontConfiguration()

          # Add CSS for page margins
          css = CSS(string='''
              @page {
                  size: A4;
                  margin: 15mm;
              }
          ''', font_config=font_config)

          HTML('codeql-report.html').write_pdf(
              'codeql-security-report.pdf',
              stylesheets=[css],
              font_config=font_config
          )
          print("PDF generated successfully")

      - name: Verify PDF output
        run: ls -lh codeql-security-report.pdf

      - name: Export finding counts
        id: counts
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          c = json.loads(pathlib.Path("codeql-counts.json").read_text())
          for k in ("total", "critical", "high", "medium", "low", "info"):
              print(f"{k}={c[k]}")
          PY

      - name: Upload PDF Report
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.names.outputs.pdf_artifact }}
          path: codeql-security-report.pdf
          retention-days: 90

      - name: Upload HTML Report
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.names.outputs.html_artifact }}
          path: codeql-report.html
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "## CodeQL PDF Report Generated ✅"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Source Run ID | ${{ steps.set-run-id.outputs.run_id }} |"
            echo "| Commit analysed | \`${{ steps.set-run-id.outputs.resolved_sha }}\` |"
            echo "| Version label | ${{ steps.names.outputs.label || '(none)' }} |"
            echo "| Generated | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo ""
            echo "| Severity | Count |"
            echo "|---|---:|"
            echo "| Critical | ${{ steps.counts.outputs.critical }} |"
            echo "| High | ${{ steps.counts.outputs.high }} |"
            echo "| Medium | ${{ steps.counts.outputs.medium }} |"
            echo "| Low | ${{ steps.counts.outputs.low }} |"
            echo "| Info | ${{ steps.counts.outputs.info }} |"
            echo "| **Total** | **${{ steps.counts.outputs.total }}** |"
            echo ""
            echo "📥 PDF and HTML are available in this run's artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.set-run-id.outputs.sha_matched }}" != "true" ]; then
            echo "> ⚠️ **The requested commit had no successful CodeQL run.** This report describes \`${{ steps.set-run-id.outputs.resolved_sha }}\` instead — do not attach it to a release as-is." >> "$GITHUB_STEP_SUMMARY"
          fi
