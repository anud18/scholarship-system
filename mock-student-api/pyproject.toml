[project]
name = "mock-student-api"
version = "1.0.0"
description = "Mock Student Database API for Development"
requires-python = ">=3.12"
dependencies = [
    # Keep in sync with requirements.txt
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.13.4",
    "requests==2.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
