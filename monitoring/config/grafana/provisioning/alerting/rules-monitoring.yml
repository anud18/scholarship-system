apiVersion: 1
groups:
  - orgId: 1
    name: monitoring_health
    folder: Alerts
    interval: 60s
    rules:
      - uid: alert-prometheus-target-down
        title: PrometheusTargetDown
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-uid
            model:
              expr: up == 0
              refId: A
              instant: true
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }} ({{ $labels.environment }})"
        isPaused: false

      - uid: alert-loki-ingestion-falling-behind
        title: LokiIngestionFallingBehind
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-uid
            model:
              expr: rate(loki_distributor_bytes_received_total[5m]) > rate(loki_ingester_chunks_flushed_total[5m]) * 1000
              refId: A
              instant: true
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Loki ingestion is falling behind"
          description: "Loki is receiving logs faster than it can flush them. This may cause memory issues."
        isPaused: false

      - uid: alert-prometheus-storage-low
        title: PrometheusStorageLow
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-uid
            model:
              # Guard against Prometheus deployments without `--storage.tsdb.retention.size`
              # set: prometheus_tsdb_retention_limit_bytes == 0 → division → +Inf →
              # always > 0.8 → the alert fires forever with value `+Inf%`. The
              # `and ... > 0` clause filters those out so we only alert when a
              # real retention target exists. See issue #184.
              expr: (prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes) > 0.8 and prometheus_tsdb_retention_limit_bytes > 0
              refId: A
              instant: true
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Prometheus storage usage is high"
          description: "Prometheus is using more than 80% of its storage retention limit. Current value: {{ if eq $value 0.0 }}0%{{ else }}{{ $value | humanizePercentage }}{{ end }}"
        isPaused: false

      # A failing compaction/checkpoint means the WAL is never truncated, so the
      # Prometheus volume grows without bound (~0.8 GB/day on the prod AP VM).
      # Prometheus only repairs a corrupt WAL at START-UP, so a torn record left
      # by one ENOSPC keeps every later compaction failing until someone
      # restarts it — the 2026-08-27 → 09-23 incident, which none of the size
      # based rules above could see (PrometheusStorageLow needs
      # --storage.tsdb.retention.size, which no stage sets).
      - uid: alert-prometheus-compaction-failing
        title: PrometheusCompactionFailing
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: prometheus-uid
            model:
              # Compactions run every 2h; a 3h window always spans one attempt.
              expr: increase(prometheus_tsdb_compactions_failed_total[3h]) > 0 or increase(prometheus_tsdb_checkpoint_creations_failed_total[3h]) > 0
              refId: A
              instant: true
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          category: monitoring
        annotations:
          summary: "Prometheus TSDB compaction is failing — its WAL will grow until the disk is full"
          description: "Compaction or WAL checkpointing failed in the last 3h on {{ $labels.instance }}. Check `docker logs monitoring_prometheus | grep 'compaction failed'`. A 'corruption in segment' error needs Prometheus stopped and wal/ + chunks_head/ removed (persisted blocks are kept); a plain restart also repairs it but replays the whole WAL first."
        isPaused: false
