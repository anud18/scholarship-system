# Grafana Datasource Provisioning Configuration
# Automatically provisions Prometheus and Loki datasources on startup

apiVersion: 1

datasources:
  # =========================================================================
  # PROMETHEUS - Metrics Database
  # =========================================================================
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    orgId: 1
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      # cacheLevel rounds the time range of METADATA queries (label and series
      # lookups — i.e. every dashboard variable dropdown) to a coarse boundary so
      # repeated lookups hit a cache. At `High` that boundary is one hour, and
      # the rounded window ENDS at the last boundary rather than at now: on
      # 2026-08-17 a freshly deployed stack asked for 11:00→12:00 while the clock
      # said 12:52 and Prometheus had been up for 23 minutes. The response was an
      # empty list, so every `environment` / `vm` / `instance` dropdown on every
      # dashboard was empty, panels resolved to `environment=""`, and Loki
      # rejected the resulting selector outright. The stack looked broken for up
      # to an hour after each first deploy — exactly when someone is looking at
      # it to confirm the deploy worked.
      #
      # `None` means dropdowns always reflect now. What that costs is a cache hit
      # on label lookups for a handful of operators, which is nothing; what it
      # buys is that a correct deployment never looks like a broken one.
      cacheLevel: 'None'
      # Unrelated to the above: this one applies to range queries in panels, and
      # only ever extends an existing series, so it cannot hide fresh data.
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      # Enable exemplars for tracing (if used in future)
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo  # For future Tempo integration
    version: 1

  # =========================================================================
  # LOKI - STAGING TENANT
  # =========================================================================
  - name: Loki (Staging)
    type: loki
    uid: loki-staging-uid
    orgId: 1
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
      # Multi-tenant configuration for staging
      httpHeaderName1: 'X-Scope-OrgID'
      # Derived fields for linking logs to traces (future use)
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: tempo
    secureJsonData:
      httpHeaderValue1: 'staging'
    version: 1

  # =========================================================================
  # LOKI - PRODUCTION TENANT
  # =========================================================================
  - name: Loki (Production)
    type: loki
    uid: loki-prod-uid
    orgId: 1
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
      # Multi-tenant configuration for production
      httpHeaderName1: 'X-Scope-OrgID'
      # Derived fields for linking logs to traces (future use)
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: tempo
    secureJsonData:
      httpHeaderValue1: 'prod'
    version: 1

  # =========================================================================
  # LOKI - DEV TENANT (Optional, for future use)
  # =========================================================================
  - name: Loki (Dev)
    type: loki
    uid: loki-dev-uid
    orgId: 1
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
      # Multi-tenant configuration for dev
      httpHeaderName1: 'X-Scope-OrgID'
      # Derived fields for linking logs to traces (future use)
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: tempo
    secureJsonData:
      httpHeaderValue1: 'dev'
    version: 1
